spring:
  application:
    name: code-drill-control-plane
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codedrill}
    username: ${DB_USER:codedrill}
    password: ${DB_PASSWORD:codedrill}
  flyway:
    enabled: true
    # expand → dual-compatible deploy → backfill → contract 순서를 지킨다 (§15.2).
    # 배포 중 이전 버전 애플리케이션과 호환되어야 하므로 파괴적 변경을 한 번에 넣지 않는다.
    baseline-on-migrate: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  rabbitmq:
    addresses: ${BROKER_URL:amqp://codedrill:codedrill@localhost:5672}

codedrill:
  admin:
    # 첫 SECURITY_ADMIN 을 받을 계정의 이메일 (§11.2).
    #
    # **비밀이 아니다.** 알아도 그 계정의 비밀번호가 없으면 아무것도 못 한다. 그리고
    # 역할 표가 완전히 비어 있을 때만 쓰인다 — 한 번 역할이 생기면 다시 열리지 않는다.
    #
    # 비워 두면 부트스트랩이 없다. 역할을 가진 사람이 아무도 없는 환경에서는 관리자
    # API 가 전부 403 이다. 로컬 설정은 docs/running-locally.md 를 따른다.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  quota:
    # 한 사람이 판정 큐를 혼자 채우지 못하게 한다 (§10.2).
    #
    # 기본값은 사람이 손으로 푸는 속도를 기준으로 잡았다. 한 문제를 고쳐 다시 내는 데
    # 몇 초는 걸리므로 분당 30건이면 사람에게는 닿지 않고 스크립트에는 곧바로 닿는다.
    in-flight: ${QUOTA_IN_FLIGHT:5}
    per-minute: ${QUOTA_PER_MINUTE:30}
  trace:
    # 원본 트레이스 보존 (§7.4). 리플레이는 방금 낸 제출을 되짚어 보는 기능이라,
    # 이보다 오래된 트레이스를 여는 일은 거의 없다.
    retention-days: ${TRACE_RETENTION_DAYS:30}
    sweep-interval-ms: ${TRACE_SWEEP_INTERVAL_MS:3600000}
  content:
    root: ${CONTENT_ROOT:content/problems}
  outbox:
    poll-interval-ms: 200

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:1.0}

logging:
  # 구조화 JSON 과 안정적인 event name 을 쓴다. 사용자 stdout/stderr 는 이 스트림에
  # 섞지 않고 제한된 별도 객체로 저장한다 (§13.3).
  level:
    root: INFO

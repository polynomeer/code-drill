name: images

# 배포 이미지 세 개를 만든다 (기술 설계서 §5.5, §15.1).
#
# ci.yml 이 앞단(빌드·테스트·콘텐츠 검증)을 맡고, 여기서는 그 결과가 실제로 이미지로
# 묶이는지 본다. 빌드가 깨지는 것을 배포하려는 순간에 알면 늦다.
#
# 아직 어디에도 올리지 않는다. 레지스트리와 서명·SBOM·스캔은 배포 대상이 정해져야
# 붙는다 — docs/production-readiness.md 의 A1, B4.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # 하나가 깨져도 나머지 결과를 본다. 셋은 같은 빌더를 쓰므로 원인이 공유될 때가 많다.
      fail-fast: false
      matrix:
        target: [control-plane, orchestrator, runner-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          # 태그는 커밋 SHA 다. latest 는 쓰지 않는다 — 무엇이 떠 있는지 물었을 때
          # 답이 시간에 따라 달라지는 태그는 롤백의 근거가 되지 못한다 (docs/deploying.md).
          tags: codedrill/${{ matrix.target }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # 뜨지 않는 이미지는 만든 적 없는 것과 같다. Runner 는 격리를 강제하면 컨테이너
      # 런타임이 없는 CI 에서 기동을 거부해야 하고, 그 거부가 정상 동작이다.
      - name: 기동 확인
        run: |
          if [ "${{ matrix.target }}" = "runner-agent" ]; then
            output=$(docker run --rm -e REQUIRE_ISOLATION=true \
              codedrill/runner-agent:${{ github.sha }} 2>&1 || true)
            echo "$output" | grep -q "기동을 중단한다" \
              || { echo "격리를 강제했는데 기동을 막지 않았다"; echo "$output" | tail -20; exit 1; }
          else
            docker run --rm --entrypoint java \
              codedrill/${{ matrix.target }}:${{ github.sha }} -version
          fi

name: images

# 배포 이미지 넷을 만들고, main 에 들어온 것만 레지스트리에 올린다 (§5.5, §15.1, §11.4).
#
# ci.yml 이 앞단(빌드·테스트·콘텐츠 검증)을 맡는다. 여기서는 그 결과가 실제로 이미지로
# 묶이고, 뜨고, 어디선가 내려받을 수 있는 것이 되는지 본다.
#
# **만들기와 올리기를 나눈다.** 먼저 로컬로 만들어 기동과 취약점을 확인하고, 통과한 것만
# 올린다. 순서를 바꾸면 뜨지 않거나 구멍 난 이미지가 태그를 갖게 되고, 그 태그를 롤백
# 대상으로 믿게 된다. 게이트가 push 뒤에 있으면 그것은 게이트가 아니라 보고서다.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 레지스트리에 올리기.
      packages: write
      # 서명 없는 출처 증명(provenance)과 SBOM 을 이미지에 붙이기 위한 OIDC 토큰.
      # 비밀 키가 없다 — 키를 보관하면 그 키가 새로운 장기 비밀이 된다 (§11.2).
      id-token: write
      attestations: write

    strategy:
      # 하나가 깨져도 나머지 결과를 본다. 넷은 같은 빌더를 쓰므로 원인이 공유될 때가 많다.
      fail-fast: false
      matrix:
        target: [control-plane, orchestrator, runner-agent, web]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 태그는 커밋 SHA 다. latest 는 쓰지 않는다 — 무엇이 떠 있는지 물었을 때 답이
      # 시간에 따라 달라지는 태그는 롤백의 근거가 되지 못한다 (docs/deploying.md).
      - name: 이름 정하기
        id: name
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: 만들기
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # 뜨지 않는 이미지는 만든 적 없는 것과 같다.
      - name: 기동 확인
        run: |
          image=${{ steps.name.outputs.image }}:${{ github.sha }}
          case "${{ matrix.target }}" in
            runner-agent)
              # 격리를 강제하면 컨테이너 런타임이 없는 CI 에서 기동을 거부해야 하고,
              # 그 거부가 정상 동작이다 (§5.2).
              output=$(docker run --rm -e REQUIRE_ISOLATION=true "$image" 2>&1 || true)
              echo "$output" | grep -q "기동을 중단한다" \
                || { echo "격리를 강제했는데 기동을 막지 않았다"; echo "$output" | tail -20; exit 1; }
              ;;
            web)
              # 설정이 틀린 nginx 는 뜨지 않는다. `nginx -t` 가 그것을 먼저 잡는다 —
              # compose 헬스체크가 한 번도 통과한 적 없던 일을 겪고 넣었다.
              docker run --rm "$image" nginx -t
              ;;
            *)
              docker run --rm --entrypoint java "$image" -version
              ;;
          esac

      # 스캐너 DB 는 크고 자주 바뀐다. 날짜로 키를 두어 하루 한 번만 받는다 —
      # 캐시가 없으면 스캔보다 내려받기가 오래 걸린다.
      - name: 스캐너 DB 캐시
        uses: actions/cache@v4
        with:
          path: build/trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # §11.4 네 게이트 중 마지막. 정책은 scripts/scan-images.py 에 있고 로컬에서도
      # 같은 명령으로 돈다 — 게이트가 CI 안에만 살면, 막혔을 때 손에 쥔 것이 로그뿐이다.
      - name: 취약점 게이트
        run: python3 scripts/scan-images.py ${{ steps.name.outputs.image }}:${{ github.sha }}

      - name: 레지스트리 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 올리기는 캐시를 그대로 쓰므로 다시 빌드하지 않는다. SBOM 과 provenance 는
      # 레지스트리에 붙는 것이라 이 단계에서만 만들 수 있다 — B4 이미지 스캔 게이트가
      # 이 둘 위에 선다.
      - name: 올리기
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}

      # 이 이미지가 이 저장소의 이 커밋에서 이 워크플로로 만들어졌다는 증명.
      # `gh attestation verify` 로 확인한다 (docs/deploying.md).
      - name: 출처 증명
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # 사용자 코드가 실제로 도는 이미지 (§5.5). 우리가 만들지 않았지만 **우리가 고른
  # 것**이고, 신뢰 경계 바깥에서 가장 노출된 자리다. 우리 이미지만 스캔하고 여기를
  # 빼면, 정작 공격자가 서 있는 바닥은 아무도 보지 않는 셈이 된다.
  #
  # 이 잡은 우리 빌드와 무관하게 깨질 수 있다 — 상류가 새 CVE 를 받으면 코드를 한 줄도
  # 바꾸지 않은 날에도 빨개진다. 그것이 알고 싶은 사실이다.
  sandbox-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 스캐너 DB 캐시
        uses: actions/cache@v4
        with:
          path: build/trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: |
          docker pull --quiet eclipse-temurin:21-jre
          docker pull --quiet python:3.12-alpine
          python3 scripts/scan-images.py eclipse-temurin:21-jre python:3.12-alpine

name: cli

# codedrill CLI (cli/, feature-roadmap 11단계 이어서 2단계). 바뀌면 시험하고, `v*` 태그를 밀면 릴리스한다.
#
# 릴리스: 여섯 판(macOS·Linux·Windows × amd64·arm64)을 GitHub Releases 에 올리고, checksums.txt 를
# cosign 으로 키 없이 서명한다(이 워크플로의 OIDC 신원). TAP_GITHUB_TOKEN 비밀이 있으면 Homebrew 탭
# (polynomeer/homebrew-tap)과 Scoop 버킷(polynomeer/scoop-bucket)에도 쓴다 — 없으면 건너뛴다.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['cli/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

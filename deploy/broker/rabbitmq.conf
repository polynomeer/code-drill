# 배포용 브로커 설정 (기술 설계서 §11.2 워크로드 신원, mTLS).
#
# docker-compose.apps.yml 이 conf.d 에 얹는다. 개발용 브로커(docker-compose.yml 단독)는
# 이 파일을 읽지 않으므로 거기서는 5672 에 비밀번호로 붙는다.
#
# **평문 리스너가 없다.** 앱과 Runner 노드는 5671 로만 붙고, 붙을 때 자기 인증서를 내야
# 한다. 인증서의 CN 이 브로커 사용자 이름이 된다 — control-plane, orchestrator, runner.
# 브로커에 닿을 수 있다는 것만으로는 아무것도 넣거나 뺄 수 없다.

listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile = /etc/rabbitmq/certs/broker.pem
ssl_options.keyfile = /etc/rabbitmq/certs/broker-key.pem
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true

# 비밀번호 로그인이 없다. EXTERNAL 은 TLS 핸드셰이크에서 본 클라이언트 인증서로 신원을
# 정한다. 운영자 계정(이미지 기본 사용자)은 AMQP 로는 못 들어오고 관리 UI 로만 쓴다.
auth_mechanisms.1 = EXTERNAL
ssl_cert_login_from = common_name

# 토폴로지와 신원·권한. 코드에서 만든 파일이다 (platform/messaging BrokerDefinitions).
load_definitions = /etc/rabbitmq/definitions.json

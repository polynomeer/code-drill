# 로컬 관측 스택 (기술 설계서 §13.2).
#
# 세 앱은 호스트에서 돌고 Prometheus 는 컨테이너에서 돈다. 그래서 localhost 가 아니라
# host.docker.internal 로 긁는다 — 컨테이너 안의 localhost 는 컨테이너 자신이다.
# Linux 에서는 compose 의 extra_hosts 가 같은 이름을 게이트웨이로 풀어 준다.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { plane: control }

  - job_name: judge-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: { plane: judge }

  - job_name: judge-runner
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels: { plane: judge }

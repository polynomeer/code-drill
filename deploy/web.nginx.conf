# 웹 정적 자산 + /api 프록시 (기술 설계서 §2.3, §9.1).
#
# 개발에서는 Vite 가 이 두 가지를 해 줬다 (vite.config.ts 의 proxy). 배포에는 Vite 가
# 없으므로 같은 일을 여기서 한다. **둘이 어긋나면 로컬에서만 되는 제품이 된다.**

server {
    # nginx-unprivileged 이미지는 비특권 사용자로 돌아 80 을 열 수 없다.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Monaco 청크가 3.9MB 다. 압축하면 1.0MB 가 된다 — 이 한 줄의 값이 그만큼이다.
    gzip_min_length 1024;

    # 해시가 붙은 자산은 내용이 바뀌면 이름이 바뀐다. 그래서 영구 캐시로 둘 수 있다.
    location /assets/ {
        # `expires` 와 함께 쓰지 않는다 — 둘 다 Cache-Control 을 내보내 헤더가 두 줄이 된다.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 은 절대 캐시하지 않는다. 이 파일이 어떤 자산을 가리키는지가 배포마다
    # 바뀌므로, 캐시된 index.html 은 사라진 자산을 가리키는 흰 화면이 된다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        # 이름을 **요청할 때** 푼다.
        #
        # `proxy_pass http://control-plane:8080;` 로 적으면 nginx 가 기동 시점에 이름을
        # 풀고, 못 풀면 아예 뜨지 않는다. 두 가지가 따라온다 — 제어 영역보다 먼저 뜨면
        # 웹이 죽고, 제어 영역이 재기동해 주소가 바뀌면 웹은 사라진 주소를 계속 붙든다.
        # `nginx -t` 마저 이름을 풀려 해서, 제어 영역 없이는 설정 검사도 못 한다.
        #
        # 변수로 쓰면 요청마다 resolver 에 묻는다. 127.0.0.11 은 컨테이너 런타임이
        # 넣어 주는 DNS 다 (compose 네트워크 안에서 서비스 이름을 푼다).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://control-plane:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 는 버퍼링 없이 흘려보낸다 (§9.1). 버퍼링을 켜 두면 nginx 가 이벤트를 모아
        # 두었다가 한꺼번에 내보내고, 사용자에게는 판정이 "한참 뒤에 갑자기" 도착한다.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 판정을 기다리는 SSE 연결은 오래 열려 있다. 기본 60초로는 판정이 끝나기 전에
        # 끊기고, 브라우저가 다시 붙는 동안의 이벤트가 사라진다.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA 다. 새로고침하거나 ?submission=<id> 로 바로 들어와도 index.html 이 나와야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

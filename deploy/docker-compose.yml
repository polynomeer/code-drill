# 로컬 개발용 플랫폼 의존성 (기술 설계서 §0.1).
#
# 운영 토폴로지(§2.3)의 신뢰 경계는 재현하지 않는다. Runner 격리와 네트워크 분리는
# 컨테이너 오케스트레이터 정책으로 다루며, 여기서는 Control Plane 이 붙을 상태 저장소만 띄운다.
#
# 호스트 포트는 전부 환경변수로 바꿀 수 있다. 개발 머신에 이미 같은 포트를 쓰는 스택이
# 떠 있는 경우가 흔하다:
#   POSTGRES_PORT=55432 REDIS_PORT=56379 docker compose -f deploy/docker-compose.yml up -d

name: code-drill

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codedrill
      POSTGRES_USER: codedrill
      POSTGRES_PASSWORD: codedrill
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codedrill"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 쿼터 카운터와 짧은 캐시에만 쓴다. 진실의 원천은 항상 DB 다 (§10.1).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # 노드 이름이 호스트 이름에서 나온다. 고정하지 않으면 컨테이너를 다시 만들 때마다
    # 다른 노드가 되어 아래 볼륨의 큐를 자기 것으로 보지 않는다.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: codedrill
      RABBITMQ_DEFAULT_PASS: codedrill
    # 채점 작업 큐는 운영에서 quorum queue 로 선언한다 (§0.1, §12.3). quorum 은 디스크에
    # 남는 큐다 — 볼륨이 없으면 컨테이너와 함께 사라져 "유실 0"이 빈말이 된다.
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_UI_PORT:-15672}:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 오브젝트 스토어 (§8.3). 소스·테스트 번들·워크스페이스는 DB 가 아니라 여기에 두고
  # 참조와 digest 만 보관한다.
  #
  # MinIO 였다. 2026-09 에 MinIO 의 컨테이너 이미지가 Docker Hub·quay·ghcr 어디에서도
  # 익명으로 받히지 않게 됐고, 이미 받아 둔 개발 머신에서만 스택이 떴다 — 새 머신인 CI 가
  # 기동에서 걸려 드러났다. 자격증명이 있어야 받는 의존성은 배포 호스트에서도 같은 자리에서
  # 막히므로, 익명으로 받히는 S3 구현으로 옮겼다. 앱 쪽은 S3 SDK 그대로라 바뀌지 않는다.
  storage:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    environment:
      STORAGE_BUCKET: codedrill
      STORAGE_ROOT_KEY: codedrill
      STORAGE_ROOT_SECRET: codedrill
      # 개발 기본값. 배포에서는 .env 가 덮어쓴다 (docker-compose.apps.yml).
      STORAGE_ORCHESTRATOR_SECRET: ${STORAGE_ORCHESTRATOR_SECRET:-codedrill}
      STORAGE_RUNNER_SECRET: ${STORAGE_RUNNER_SECRET:-codedrill}
      STORAGE_CONTROL_PLANE_SECRET: ${STORAGE_CONTROL_PLANE_SECRET:-codedrill}
    ports: ["${STORAGE_PORT:-8333}:8333", "${STORAGE_UI_PORT:-8888}:8888"]
    volumes:
      - storage-data:/data
      - ./storage/start.sh:/etc/seaweedfs/start.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- 관측 스택 (§13.2) ---
  #
  # 기본 기동에는 들어가지 않는다. 대시보드 없이도 개발은 되고, 두 컨테이너가 늘 떠
  # 있으면 개발 머신에서 체감이 나쁘다. 필요할 때만 켠다:
  #   docker compose -f deploy/docker-compose.yml --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [alertmanager]
    # 앱은 호스트에서 돌고 Prometheus 는 컨테이너에서 돈다. macOS 는 이 이름을 기본
    # 제공하지만 Linux 는 아니라서 명시한다.
    extra_hosts: ["host.docker.internal:host-gateway"]

  # 경보를 실제로 내보내는 곳 (§13.4). 이것이 없으면 규칙은 평가만 되고 아무 데도 가지
  # 않는다 — 화면을 보고 있는 사람에게만 있는 경보다.
  #
  # 수신자는 observability/alertmanager.yml 에서 채운다. 채우지 않으면 여기까지는 오고
  # 그다음에서 멈춘다. 어디서 멈췄는지는 :9093 의 UI 에 보인다.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["observability"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    environment:
      # 로컬 전용이라 로그인을 끈다. 이 설정을 공개 환경에 그대로 들고 가지 않는다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  rabbitmq-data:
  storage-data:

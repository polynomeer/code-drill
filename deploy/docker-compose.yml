# 로컬 개발용 플랫폼 의존성 (기술 설계서 §0.1).
#
# 운영 토폴로지(§2.3)의 신뢰 경계는 재현하지 않는다. Runner 격리와 네트워크 분리는
# 컨테이너 오케스트레이터 정책으로 다루며, 여기서는 Control Plane 이 붙을 상태 저장소만 띄운다.
#
# 호스트 포트는 전부 환경변수로 바꿀 수 있다. 개발 머신에 이미 같은 포트를 쓰는 스택이
# 떠 있는 경우가 흔하다:
#   POSTGRES_PORT=55432 REDIS_PORT=56379 docker compose -f deploy/docker-compose.yml up -d

name: code-drill

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codedrill
      POSTGRES_USER: codedrill
      POSTGRES_PASSWORD: codedrill
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codedrill"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 쿼터 카운터와 짧은 캐시에만 쓴다. 진실의 원천은 항상 DB 다 (§10.1).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: codedrill
      RABBITMQ_DEFAULT_PASS: codedrill
    # 채점 작업 큐는 운영에서 quorum queue 로 선언한다 (§0.1, §12.3).
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_UI_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: codedrill
      MINIO_ROOT_PASSWORD: codedrill
    # 소스·테스트 번들·로그·트레이스는 DB 가 아니라 여기에 두고 참조와 digest 만 보관한다 (§8.3).
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_UI_PORT:-9001}:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- 관측 스택 (§13.2) ---
  #
  # 기본 기동에는 들어가지 않는다. 대시보드 없이도 개발은 되고, 두 컨테이너가 늘 떠
  # 있으면 개발 머신에서 체감이 나쁘다. 필요할 때만 켠다:
  #   docker compose -f deploy/docker-compose.yml --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    # 앱은 호스트에서 돌고 Prometheus 는 컨테이너에서 돈다. macOS 는 이 이름을 기본
    # 제공하지만 Linux 는 아니라서 명시한다.
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    environment:
      # 로컬 전용이라 로그인을 끈다. 이 설정을 공개 환경에 그대로 들고 가지 않는다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  minio-data:

# 이미지로 뜬 앱 (기술 설계서 §2.3 배포 토폴로지).
#
# 의존성 파일과 함께 쓴다. 프로젝트 이름이 같아야 같은 네트워크에 붙는다.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.apps.yml \
#     --profile apps up -d
#
# 컨테이너끼리는 서비스 이름과 **컨테이너 안 포트**로 붙는다. 호스트 포트를 비켜 가도
# 여기는 그대로다 — 그게 네트워크를 나누는 이유다.
#
# **Runner 는 여기 없다.** 이유는 docs/deploying.md 의 "Runner 를 어디서 돌리나" 에 있다.
# 한 줄로 줄이면: 사용자 코드를 격리하는 컴포넌트에 호스트 컨테이너 런타임을 통째로
# 내주면 격리가 뒤집힌다.
#
# **브로커는 인증서로만 받는다** (§11.2). 먼저 `python3 scripts/certs.py` 로 deploy/certs/ 를
# 만든다. 앱마다 자기 신원 디렉터리만 들고 가고, 브로커 사용자·권한·토폴로지는
# deploy/broker/definitions.json 이 정한다 — 앱은 큐를 선언하지 않는다.

name: code-drill

services:
  # 오브젝트 스토어의 버킷과 신원 (§8.3, §11.2). 스토어가 뜬 뒤 한 번 돌고 끝난다.
  # 비밀 둘은 밖에서 준다 — 오케스트레이터(읽기·쓰기)와 Runner 노드(읽기)의 것이다.
  storage-init:
    # 서버 이미지에 mc 가 들어 있다. 이미지를 하나 더 받지 않는다.
    image: minio/minio:latest
    profiles: ["apps"]
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: codedrill
      MINIO_ROOT_PASSWORD: codedrill
      STORAGE_ORCHESTRATOR_SECRET: ${STORAGE_ORCHESTRATOR_SECRET:?오케스트레이터의 스토어 비밀이 필요하다}
      STORAGE_RUNNER_SECRET: ${STORAGE_RUNNER_SECRET:?Runner 의 스토어 비밀이 필요하다}
    volumes: ["./storage/init.sh:/init.sh:ro"]
    depends_on:
      minio: {condition: service_healthy}

  rabbitmq:
    # 개발용 브로커(docker-compose.yml)와 다른 점 셋: 평문 5672 가 없고, 인증서로만
    # 들어오며, 토폴로지와 권한을 정의 파일에서 읽는다. 자세한 것은 broker/rabbitmq.conf.
    ports: !override ["${RABBITMQ_TLS_PORT:-5671}:5671", "${RABBITMQ_UI_PORT:-15672}:15672"]
    volumes:
      - ./broker/rabbitmq.conf:/etc/rabbitmq/conf.d/20-codedrill.conf:ro
      - ./broker/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./broker/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./certs/broker:/etc/rabbitmq/certs:ro

  control-plane:
    image: codedrill/control-plane:${CODEDRILL_TAG:-dev}
    profiles: ["apps"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codedrill
      REDIS_URL: redis://redis:6379
      BROKER_URL: amqps://rabbitmq:5671
      BROKER_TLS_DIR: /etc/codedrill/broker-tls
      BROKER_DECLARE_TOPOLOGY: "false"
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
    volumes: ["./certs/control-plane:/etc/codedrill/broker-tls:ro"]
    ports: ["${CONTROL_PLANE_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      # curl 을 쓴다. 예전에는 `/dev/tcp` 로 소켓을 열었는데 그것은 bash 기능이고 이
      # 이미지의 `/bin/sh` 는 dash 라, 헬스체크가 **한 번도 통과한 적이 없었다** —
      # 앱은 멀쩡히 떠 있는데 compose 는 계속 unhealthy 로 보고, 이 서비스를 기다리던
      # web 이 아예 뜨지 않았다. 이미지로 실제로 띄워 보고서야 드러났다.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  orchestrator:
    image: codedrill/orchestrator:${CODEDRILL_TAG:-dev}
    profiles: ["apps"]
    environment:
      BROKER_URL: amqps://rabbitmq:5671
      BROKER_TLS_DIR: /etc/codedrill/broker-tls
      BROKER_DECLARE_TOPOLOGY: "false"
      # 임대와 fencing 토큰이 여기 있다 (§4.3). 재시작과 인스턴스 여럿을 넘기는 유일한 자리다.
      REDIS_URL: redis://redis:6379
      # 테스트 번들을 올리는 곳 (§8.3). 이 버킷에 읽고 쓴다.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: orchestrator
      STORAGE_SECRET_KEY: ${STORAGE_ORCHESTRATOR_SECRET:?}
    volumes: ["./certs/orchestrator:/etc/codedrill/broker-tls:ro"]
    ports: ["${ORCHESTRATOR_PORT:-8081}:8081"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}

  # 배포 단위 넷째. 정적 자산을 내주고 /api 를 제어 영역으로 넘긴다 — 개발에서 Vite 가
  # 하던 일이다 (deploy/web.nginx.conf).
  #
  # 브라우저가 보는 주소는 이것 하나뿐이다. 제어 영역 포트를 밖으로 열 이유가 없으므로,
  # 공개 배포에서는 위의 control-plane `ports:` 를 지운다.
  web:
    image: codedrill/web:${CODEDRILL_TAG:-dev}
    profiles: ["apps"]
    ports: ["${WEB_PORT:-8090}:8080"]
    depends_on:
      control-plane: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

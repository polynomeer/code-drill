spring:
  application:
    name: code-drill-judge-orchestrator
  rabbitmq:
    addresses: ${BROKER_URL:amqp://codedrill:codedrill@localhost:5672}
  data:
    redis:
      # 임대와 fencing 토큰이 여기 있다 (§4.3). 제어 영역과 같은 Redis 라도 키 접두사가 다르다.
      url: ${REDIS_URL:redis://localhost:6379}

codedrill:
  storage:
    # 테스트 번들이 가는 오브젝트 스토어 (§8.3). 비우면 디렉터리로 내려간다 — 같은 머신에서만 통한다.
    endpoint: ${STORAGE_ENDPOINT:}
    bucket: ${STORAGE_BUCKET:codedrill}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    directory: ${STORAGE_DIRECTORY:}
  judge:
    # redis 가 기본이다. memory 는 Redis 없는 개발용 — 재시작하면 진행 중인 실행을 회수하지 못한다.
    lease-store: ${JUDGE_LEASE_STORE:redis}
  messaging:
    # 브로커에 밝히는 신원 (§11.2). 발행은 전부 judge.from.orchestrator 로 나간다.
    identity: orchestrator
    # 배포에서는 false — 브로커가 정의 파일로 토폴로지를 갖고, 앱에는 선언 권한이 없다.
    declare-topology: ${BROKER_DECLARE_TOPOLOGY:true}
    tls:
      # cert.pem·key.pem·ca.pem 이 있는 디렉터리. 주면 mTLS 로 붙고 인증서로 로그인한다.
      dir: ${BROKER_TLS_DIR:}
  content:
    root: ${CONTENT_ROOT:content/problems}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

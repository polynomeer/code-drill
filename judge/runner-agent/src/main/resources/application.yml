spring:
  application:
    name: code-drill-runner-agent
  rabbitmq:
    addresses: ${BROKER_URL:amqp://codedrill:codedrill@localhost:5672}
    listener:
      simple:
        # 실행은 CPU 를 통째로 쓴다. 한 에이전트가 동시에 여러 샌드박스를 띄우면
        # 측정치가 서로 오염된다 (§5.2 CPU/wall 동시 측정).
        concurrency: 1
        max-concurrency: 1
        prefetch: 1

codedrill:
  messaging:
    # 브로커에 밝히는 신원 (§11.2). 발행은 전부 judge.from.runner 로 나간다.
    identity: runner
    # 배포에서는 false — 브로커가 정의 파일로 토폴로지를 갖고, 앱에는 선언 권한이 없다.
    declare-topology: ${BROKER_DECLARE_TOPOLOGY:true}
    tls:
      # cert.pem·key.pem·ca.pem 이 있는 디렉터리. 주면 mTLS 로 붙고 인증서로 로그인한다.
      dir: ${BROKER_TLS_DIR:}
  sandbox:
    # 공개 환경에서는 반드시 true. 컨테이너 런타임이 없으면 기동을 중단한다 (§5.2).
    require-isolation: ${REQUIRE_ISOLATION:false}
    # Runner 가 컨테이너 안에서 돌 때, 호스트와 이름이 같은 경로여야 한다.
    # 비우면 임시 디렉터리를 쓴다 (SandboxProperties.workRoot 에 이유를 적었다).
    work-root: ${SANDBOX_WORK_ROOT:}
    images:
      # 운영에서는 태그가 아니라 digest 로 고정한다 (§5.5).
      kotlin: ${KOTLIN_IMAGE:eclipse-temurin:21-jre}
      # JDK 다. 컴파일도 이 안에서 돌고, javac 은 JRE 에 없다 (§5.5).
      java: ${JAVA_IMAGE:eclipse-temurin:21-jdk}
      python: ${PYTHON_IMAGE:python:3.12-alpine}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "사람을 가르는 것은 이메일뿐입니다. 이름이 같은 다른 사람도, 이름이 다른 같은 사람도 있습니다."
MODELING:
  - "계정을 정점, 같은 이메일을 간선으로 보면 사람은 연결 요소입니다. 이메일마다 처음 본 계정을 기억해 두고, 다시 보이면 그 계정과 합치세요."
CORRECTNESS:
  - "이메일의 주인을 볼 때마다 덮어쓰기만 하면 사슬(a-b, b-c)이 끊깁니다. 합치는 것은 유니온파인드가 합니다."
OPTIMIZATION:
  - "계정 쌍마다 이메일이 겹치는지 보면 n² 입니다. 이메일 → 계정 표 하나면 전체 이메일 수에 비례합니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "'엄격히' 라는 말이 무엇을 막는지 먼저 정하세요. 평평한 구간은 오르막인가요, 내리막인가요?"
  - "오르막과 내리막이 각각 적어도 한 칸 있어야 합니다. 그러면 길이의 하한이 정해집니다."
EDGE_CASES:
  - "꼭대기가 첫 칸이거나 마지막 칸인 경우를 각각 그려 보세요. 길이가 1 과 2 인 배열도요."
CORRECTNESS:
  - "오르막을 끝낸 자리에서 멈춘 이유는 둘 중 하나입니다 — 끝에 닿았거나, 다음이 더 크지 않거나. 두 경우를 나눠 보세요."

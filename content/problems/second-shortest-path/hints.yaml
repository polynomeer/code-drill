# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "둘째 길은 가장 짧은 길과 길이가 같아도 되나요? 지문의 엄격히라는 말을 다시 읽어 보세요."
  - "같은 간선을 갔다가 되돌아오는 것도 길입니다. 간선이 하나뿐인 그래프에서도 둘째 길이 있나요?"
MODELING:
  - "정점마다 거리를 하나가 아니라 둘 들고 다니면 어떨까요? 가장 짧은 것과, 그보다 엄격히 긴 것 중 가장 짧은 것."
  - "새 거리가 첫째보다 짧으면 옛 첫째는 어디로 가나요? 첫째와 둘째 사이에 오면요?"
CORRECTNESS:
  - "정점을 한 번 꺼내고 닫으면 둘째 거리는 이웃에게 퍼지지 못합니다. 정점을 몇 번까지 꺼내야 하나요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "봉지 집합 하나를 아이 j 명에게 나눌 때의 가장 작은 최댓값을 안다면, 아이 한 명을 더할 때는 무엇을 정하면 되나요?"
ALGORITHM_CHOICE:
  - "봉지가 12 개뿐입니다. 봉지의 집합을 비트로 나타내면 몇 가지인가요? 집합마다 합을 미리 구해 둘 수 있나요?"
CORRECTNESS:
  - "큰 봉지부터 지금 가장 적게 받은 아이에게 주면 언제나 최적인가요? [3, 3, 2, 2, 2] 를 둘에게 나눠 보세요."
  - "아이가 받는 봉지는 정렬했을 때 연속해야 하나요?"
COMPLEXITY:
  - "봉지마다 아이를 고르는 경우는 몇 가지인가요? 12 개와 12 명이면요? 부분집합의 부분집합을 모두 도는 것은 몇 걸음인가요?"

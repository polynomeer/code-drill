# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "부분 배열마다 최솟값을 찾는 대신, 원소마다 '내가 최솟값인 부분 배열이 몇 개인가'를 세어 값에 곱하세요. 합은 같습니다."
  - "원소 i 가 최솟값인 부분 배열은 왼쪽 끝이 '왼쪽으로 더 작은 값 직전'까지, 오른쪽 끝이 '오른쪽으로 더 작은 값 직전'까지입니다. 개수는 두 길이의 곱입니다."
CORRECTNESS:
  - "같은 값이 둘이면 그 둘을 모두 담는 부분 배열이 양쪽에 다 세어집니다. 한쪽은 '작은 값'에서, 다른 쪽은 '작거나 같은 값'에서 멈추게 하세요."
OPTIMIZATION:
  - "양쪽 경계를 원소마다 훑으면 다시 n² 입니다. 히스토그램 최대 직사각형과 같은 단조 스택으로 양쪽 경계가 한 번에 나옵니다."
CONSTRAINTS:
  - "값 30000 × 왼쪽 길이 × 오른쪽 길이는 Int 를 넘습니다. 곱을 Long 으로 하고, 더할 때마다 나머지를 취하세요."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "같은 정점이라도 빨간 간선으로 왔는지 파란 간선으로 왔는지에 따라 다음에 쓸 수 있는 간선이 다릅니다. 상태는 정점이 아니라 (정점, 마지막 색)입니다."
ALGORITHM_CHOICE:
  - "간선 하나가 비용 1 이니 그 상태 그래프 위의 BFS 입니다. 정점 0 은 두 상태로 동시에 출발합니다 — 첫 간선이 어느 색이든 되니까요."
  - "정점의 답은 두 상태의 거리 중 작은 것입니다. 한쪽만 닿았으면 그것입니다."
CORRECTNESS:
  - "방문 표시를 정점만으로 하면 한 색으로 먼저 온 정점을 다른 색으로 다시 지나지 못해 놓칩니다. 표시도 상태마다입니다."
EDGE_CASES:
  - "자기 자신으로 가는 간선은 색을 바꾸는 데 쓰입니다. 0 의 거리는 0 이고, 0 으로 돌아오는 경로가 그것을 바꾸지 않습니다."

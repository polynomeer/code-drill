# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

READING:
  - "아직 k개가 안 됐을 때는 무엇으로 나누나요. 문제가 그 경우를 따로 말합니다."
  - "평균은 내림입니다 — 음수도요. -7 을 2 로 나누면 -3 이 아니라 -4 입니다."
IMPLEMENTATION:
  - "창에 값이 들어올 때 합에 더하고, 창이 k 를 넘으면 가장 먼저 들어온 값을 빼세요. 가장 먼저 들어온 것이 무엇인지는 어떤 구조가 기억하나요."
EDGE_CASES:
  - "k 가 1 이면 평균은 값 자신입니다. k 가 배열보다 크면 끝까지 \"지금까지 전부\"입니다."
COMPLEXITY:
  - "값마다 최근 k개를 다시 더하면 n × k 입니다. 20만 × 10만이면 얼마입니까. 더하고 빼는 것 각 한 번이면 됩니다."

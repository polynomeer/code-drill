# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "거리를 구하는 일과 가짓수를 세는 일을 따로 하지 말고, 한 번에 들고 가 보세요. 거리가 줄었을 때와 같을 때 가짓수는 각각 어떻게 되나요?"
  - "거리가 줄면 앞의 가짓수로 바뀌고, 거리가 같으면 더합니다. 두 경우를 나눠 적어 보세요."
ALGORITHM_CHOICE:
  - "경로를 하나씩 세면 갈래가 늘수록 폭발합니다. 거리를 확정하는 순서를 이용하면 한 번에 셉니다."
CONSTRAINTS:
  - "가짓수는 금세 커집니다. 무엇을 언제 나머지로 접어야 하는지 정하세요. 거리는 접으면 안 됩니다."
CORRECTNESS:
  - "가장 가까운 것부터 확정해야 더한 값이 나중에 뒤집히지 않습니다. 그 순서를 주는 것이 무엇인가요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "정점 v 를 지우면 조각은 v 의 자식 서브트리들과 '나머지'(전체 − v 의 서브트리)입니다. 둘 다 서브트리 크기에서 나옵니다."
CORRECTNESS:
  - "나머지 조각을 빼먹으면 루트가 늘 답이 됩니다 — 루트의 조각은 자식들뿐이니까요. 사슬에서 확인해 보세요."
EDGE_CASES:
  - "정점 하나면 0. 같은 최댓값이면 번호가 작은 것. 사슬의 짝수 길이에서 가운데 둘이 같습니다."
COMPLEXITY:
  - "parent[i] < i 라 뒤에서 앞으로 돌면 서브트리 크기가 한 번에 나옵니다. 정점마다 다시 세면 n² 입니다."

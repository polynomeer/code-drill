  - "규칙 넷을 산 칸과 죽은 칸으로 나눠 다시 적어 보세요. 죽은 칸이 사는 조건은 3 이상이 아니라 정확히 3 입니다."
  - "이웃이 몇 칸인지, 격자 밖은 어떻게 보는지, 그리고 모든 칸이 동시에 바뀐다는 말이 무슨 뜻인지 — 셋 다 지문에 있습니다."


  - "이웃을 셀 때 자기 자신은 빼고, 격자 밖은 0 으로 두세요. 행 방향 -1, 0, 1 과 열 방향 -1, 0, 1 의 조합에서 둘 다 0 인 것 하나만 빠집니다."

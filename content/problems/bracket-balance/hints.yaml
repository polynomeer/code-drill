# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# 여기 없는 역량은 사다리가 문제 데이터에서 만들어진다 — 목표 복잡도는 catalog.yaml 에,
# "여기서 흔히 무너진다"는 mutants/ 의 설명 줄에 이미 있다. 같은 사실을 두 곳에 쓰지
# 않는다 (HintLadder).
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.


MODELING:
  - "닫는 괄호를 만났을 때 짝을 맞춰야 할 상대는 **가장 최근에** 열린 것입니다. 그 \"가장 최근\"을 무엇으로 기억할 수 있을까요."
  - "마지막에 넣은 것을 먼저 꺼내는 구조에 여는 괄호를 쌓아 두면, 닫는 괄호가 올 때마다 꺼내 비교하면 됩니다."

IMPLEMENTATION:
  - "실패하는 경우가 세 가지입니다. 셋을 각각 언제 알 수 있는지 적어 보세요."
  - "꺼낼 것이 없는데 닫혔을 때, 꺼낸 것이 짝이 아닐 때, 다 훑었는데 남아 있을 때 — 세 곳 모두에서 걸러야 합니다."

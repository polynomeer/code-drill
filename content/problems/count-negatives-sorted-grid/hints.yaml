# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "행과 열이 모두 내림차순이라는 것이 이 문제의 전부입니다. 음수는 각 행의 오른쪽 끝에 몰려 있고, 아래 행일수록 그 경계가 왼쪽에 있거나 같습니다."
MODELING:
  - "오른쪽 위에서 시작해, 지금 칸이 음수면 왼쪽으로, 아니면 아래로 움직여 보세요. 행을 내려갈 때 경계를 오른쪽으로 되돌릴 일이 없습니다."
EDGE_CASES:
  - "0 은 음수가 아닙니다. 행이나 열이 하나뿐인 격자, 전부 음수인 격자로 확인하세요."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

ALGORITHM_CHOICE:
  - "거듭제곱을 log 번에 하던 요령이 여기도 있습니다. F(2k) 와 F(2k+1) 을 F(k), F(k+1) 로 쓰면 n 을 절반씩 줄일 수 있습니다 — 또는 2×2 행렬을 거듭제곱하세요."
CONSTRAINTS:
  - "n 이 20 억이면 n 번 더하는 것은 안 됩니다. 곱은 (10⁹)² 이라 Long 이어야 하고, 뺄셈은 나머지 뒤에 음수가 될 수 있어 나머지를 한 번 더 더합니다."
CORRECTNESS:
  - "F(0) = 0, F(1) = 1 입니다. 마지막에 F(n) 과 F(n+1) 중 무엇을 돌려주는지 n = 1, 2 로 확인하세요."
COMPLEXITY:
  - "n 의 비트 수만큼 — 31 번의 곱셈 몇 개입니다."

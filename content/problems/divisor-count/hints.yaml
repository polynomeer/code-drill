# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "질의를 하나씩 보지 말고, 모든 답을 한 표에 담는다고 생각해 보세요. 어떤 수의 약수가 늘어나는 순간은 언제인가요?"
  - "약수 d 를 고정하면 d 의 배수마다 약수가 하나씩 늘어납니다. 질의가 아니라 약수를 바깥 반복으로 두세요."
ALGORITHM_CHOICE:
  - "질의가 십만 개이고 수가 이십만까지입니다. 질의마다 1..n 을 훑으면 몇 번인지 곱해 보세요."
COMPLEXITY:
  - "배수를 훑는 비용은 n/1 + n/2 + n/3 + … 입니다. 이 합이 대략 무엇인지 알면 통과 여부가 보입니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "값이 전부 양수라 곱은 오른쪽을 늘리면 커지고 왼쪽을 줄이면 작아집니다 — 창입니다. 오른쪽 끝마다 창 안의 모든 왼쪽 끝이 답입니다."
CONSTRAINTS:
  - "창의 곱은 k × 최댓값을 넘지 않지만 그것이 이미 Int 를 넘습니다 — 10⁹ × 1000. Long 이어야 합니다."
EDGE_CASES:
  - "k ≤ 1 이면 곱이 1 이상이라 아무 구간도 안 됩니다. 이 경우를 따로 두지 않으면 왼쪽이 오른쪽을 넘어갑니다. '미만'입니다 — 곱이 k 와 같으면 안 됩니다."
OPTIMIZATION:
  - "모든 구간은 n² 이고, 1 이 많으면 곱이 안 커져 끊기지도 않습니다. 창은 n 입니다."

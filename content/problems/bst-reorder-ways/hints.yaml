# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "BST 의 모양을 지키려면 무엇이 맨 앞이어야 하나요? 왼쪽 서브트리의 원소와 오른쪽 서브트리의 원소 사이의 순서는 모양에 영향을 주나요?"
  - "왼쪽 원소들끼리의 순서와 오른쪽 원소들끼리의 순서를 지킨 채 두 줄을 섞는 방법은 몇 가지인가요?"
CORRECTNESS:
  - "왼쪽 서브트리의 순서마다 오른쪽 서브트리의 순서를 모두 고를 수 있습니다. 둘의 수를 더하나요, 곱하나요?"
  - "섞을 자리는 몇 개인가요? 루트도 그 안에 드나요?"
EDGE_CASES:
  - "문제는 원래 순서를 뺀 수를 묻습니다. 순서가 하나뿐인 트리의 답은 얼마인가요?"
  - "나머지를 취한 값 셋을 곱하면 Long 에 드나요?"
COMPLEXITY:
  - "이항 계수를 서브트리마다 파스칼 삼각형으로 새로 쌓으면, 한 줄로 늘어선 5000 개의 트리에서 몇 걸음인가요? 팩토리얼과 역원을 미리 구해 두면요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "세 자리 중 가운데가 가장 큽니다. 가운데를 정해 놓고 왼쪽과 오른쪽에 무엇이 필요한지 말로 적어 보세요."
  - "오른쪽에서 왼쪽으로 훑으면 '이미 본 값 중 더 큰 값에 밀려난 값'이 곧 가운데와 짝이 맞는 세 번째 값입니다."
ALGORITHM_CHOICE:
  - "두 겹 반복이면 20만 개에서 무너집니다. 값을 하나씩만 넣고 빼는 자료구조로 같은 정보를 얻을 수 있는지 보세요."
CORRECTNESS:
  - "한 값이 여럿을 밀어낼 때 어느 것을 기억해야 하는지가 이 문제의 핵심입니다. 두 경우를 작은 예로 그려 비교해 보세요."

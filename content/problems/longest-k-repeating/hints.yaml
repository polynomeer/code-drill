# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "구간 전체에서 k 번 미만 나오는 글자가 있다면, 그 글자를 포함하는 부분 구간이 답이 될 수 있나요?"
ALGORITHM_CHOICE:
  - "답에 들 수 없는 글자의 자리에서 문자열을 자르면, 남은 조각마다 무엇을 물으면 되나요?"
CORRECTNESS:
  - "잘라 낸 조각 안에서는 글자 수가 줄어듭니다. 조각 안에서 새로 모자란 글자가 생기면 어떻게 하나요?"
  - "정확히 k 번 나오는 글자는 남겨도 되나요?"
COMPLEXITY:
  - "모든 시작과 끝을 세면 30 만 글자에서 몇 쌍인가요? 자를 때마다 조각에서 사라지는 글자 종류를 생각하면 자르기는 몇 층까지 갈 수 있나요?"

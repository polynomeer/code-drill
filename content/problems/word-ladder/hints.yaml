# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "단어를 정점, 글자 하나 차이를 간선으로 보세요. 묻는 것은 무엇입니까 — 가장 짧은 길이면 어떤 탐색인가요."
ALGORITHM_CHOICE:
  - "DFS 로 처음 닿은 길은 가장 짧다는 보장이 없습니다. BFS 는 층별로 가서 처음 닿은 것이 가장 짧습니다."
COMPLEXITY:
  - "간선을 모든 단어 쌍으로 만들면 2 만 × 2 만입니다. 단어 하나의 이웃은 자리마다 26 글자를 바꿔 목록에 있는지 보면 됩니다 — 그러면 단어 수 × 길이 × 26 입니다."
EDGE_CASES:
  - "end 가 목록에 없으면 0 입니다. 방문 표시가 없으면 순환에서 끝나지 않습니다. 답은 변환 횟수가 아니라 단어 수입니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "빈칸을 순서대로 세우고, 칸마다 '놓을 수 있는 값' 을 묻는 문제로 바꿔 보세요."
  - "행·열·상자 각각에 이미 쓴 숫자 아홉 개의 있고 없음만 알면 됩니다. 아홉 칸짜리 표 세 묶음입니다."
IMPLEMENTATION:
  - "놓기 전에 세 곳을 표시하고, 실패해 돌아올 때 그 셋을 똑같이 되돌리세요. 한 곳이라도 빠지면 뒤가 전부 어긋납니다."
CORRECTNESS:
  - "놓기 전에 검사하는 것과 다 놓고 검사하는 것은 답은 같지만 비용이 다릅니다. 왜 다른지 세어 보세요."
OPTIMIZATION:
  - "후보 검사가 매번 스물일곱 칸을 훑는다면, 그 스물일곱 칸이 알려 주는 것을 미리 들고 다닐 수 있습니다."

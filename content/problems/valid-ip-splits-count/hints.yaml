# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "조각은 넷, 각 조각은 0..255, 0 이 아닌 조각은 앞에 0 이 올 수 없고, 문자열은 전부 써야 합니다. 네 규칙을 하나씩 확인하세요."
EDGE_CASES:
  - "\"0\" 은 되고 \"00\"·\"010\" 은 안 됩니다. 255 는 되고 256 은 안 됩니다. 네 조각이 됐는데 글자가 남으면 안 됩니다."
IMPLEMENTATION:
  - "자리마다 길이 1·2·3 을 시도하며 조각이 올바른지 보고 내려가고, 네 조각에서 정확히 끝에 닿았을 때만 셉니다. 길이가 남은 글자를 넘으면 그만둡니다."

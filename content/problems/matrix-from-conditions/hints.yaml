# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "행의 순서와 열의 순서는 서로에게 영향을 주나요? 수 v 가 놓이는 칸은 무엇으로 정해지나요?"
  - "놓을 수 있는 수가 여럿이면 어느 것을 먼저 놓나요?"
MODELING:
  - "'a 가 b 보다 위'를 간선 a → b 로 그리면, 행의 순서는 그 그래프의 무엇인가요?"
IMPLEMENTATION:
  - "Kahn 알고리즘에서 매번 가장 작은 수를 꺼내려면 큐 대신 무엇을 쓰나요?"
EDGE_CASES:
  - "조건에 순환이 있으면 Kahn 알고리즘은 어떻게 끝나나요? 행 쪽만 순환이면요?"

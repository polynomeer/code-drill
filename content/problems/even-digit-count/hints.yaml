# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "음수의 부호는 자리인가요? 0 은 몇 자리인가요? 지문에서 두 문장을 찾아보세요."
IMPLEMENTATION:
  - "10 으로 나눠 가며 자릿수를 셀 때, 0 이 될 때까지 나눈 횟수로 세면 0 은 몇 자리가 되나요?"
EDGE_CASES:
  - "9 와 10, 99 와 100 처럼 자릿수가 바뀌는 경계에서 답이 맞는지 확인하세요. Int 의 가장 작은 값은 절댓값이 Int 에 들어가나요?"

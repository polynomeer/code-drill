# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

CONSTRAINTS:
  - "값이 몇 가지나 나올 수 있는지 제약 조건에서 읽어 보세요. 일반 정렬은 그 사실을 쓰지 않습니다."
  - "값이 셋뿐이면 0 은 왼쪽 끝으로, 2 는 오른쪽 끝으로 보내면 1 은 저절로 가운데에 남습니다. 두 번 훑어도 되고, 포인터 셋으로 한 번에도 됩니다."

IMPLEMENTATION:
  - "2 를 오른쪽 끝과 바꾼 뒤에는 방금 가운데로 온 값을 아직 보지 않았습니다. 그 자리에 멈춰서 다시 보세요."
  - "가운데 포인터가 오른쪽 경계와 같은 칸도 봐야 합니다. 작다가 아니라 작거나 같다까지입니다."

# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

READING:
  - "자릿수가 10 만 개까지입니다. 이것을 정수로 바꿀 수 있나요."
EDGE_CASES:
  - "전부 9 면 자릿수가 하나 늘어납니다. 999 + 1 은 무엇입니까."
  - "올림은 9 가 아닌 자리를 만나면 멈춥니다. 199 + 1 에서 1 은 그대로입니다."
IMPLEMENTATION:
  - "끝자리부터 보며 9 는 0 으로 바꾸고 다음 자리로 가세요. 9 가 아니면 하나 더하고 끝냅니다. 끝까지 갔으면 앞에 1 을 붙입니다."

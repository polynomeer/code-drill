# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "오른쪽 끝을 i 로 정하면, 좋은 구간의 왼쪽 끝은 어느 범위에 있어야 하나요? 범위를 벗어난 값, minK, maxK 의 마지막 자리로 말해 보세요."
CORRECTNESS:
  - "범위를 벗어난 값 뒤에 아직 minK 가 나오지 않았다면, 그 전에 나온 minK 를 쓸 수 있나요? 그때 더하는 수는 얼마인가요?"
  - "모든 값이 [minK, maxK] 안에 있는 구간과 최솟값·최댓값이 정확히 minK, maxK 인 구간은 같나요?"
EDGE_CASES:
  - "minK 와 maxK 가 같으면 어떻게 되나요?"
  - "구간은 몇 개까지 될 수 있나요? Int 에 드나요?"
COMPLEXITY:
  - "시작마다 끝을 늘려 가면 범위 안의 값만 20 만 개일 때 몇 걸음인가요?"

# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

CONSTRAINTS:
  - "과반수 원소가 반드시 있다는 약속을 다시 읽어 보세요. 그 약속이 없다면 어떤 확인이 더 필요했을까요."
  - "과반수 원소는 다른 값 하나와 짝지어 지워도 반드시 살아남습니다. 후보 하나와 개수 하나를 들고, 같으면 올리고 다르면 내리고 0 이 되면 후보를 바꾸세요. 약속 덕분에 마지막 후보가 곧 답입니다."

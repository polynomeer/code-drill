# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "구간마다 답을 적는 표를 생각해 보세요. 양 끝 글자가 다를 때는 한쪽 끝을 뺀 두 구간으로 어떻게 답을 만드나요? 둘 다에 든 것은요?"
  - "양 끝이 같은 글자라면, 가운데 구간의 회문 하나하나를 그 글자로 감싼 것이 새로 생깁니다. 그런데 가운데 안에도 같은 글자가 있으면 무엇이 이미 세어져 있나요?"
CORRECTNESS:
  - "가운데에 같은 글자가 없을 때, 하나 있을 때, 둘 이상일 때를 나눠 각각 몇 개가 새로 생기는지 작은 예로 세어 보세요."
CONSTRAINTS:
  - "답을 나머지로 접으면서 빼기를 하면 값이 음수가 될 수 있습니다. 어떻게 맞출까요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "폭이 w 이상인 간선만 남겼을 때 s 와 t 가 이어져 있다면, 답은 w 이상인가요?"
ALGORITHM_CHOICE:
  - "간선을 폭이 큰 것부터 하나씩 넣는다면, s 와 t 가 처음 이어지는 순간 넣은 간선의 폭은 무엇인가요? 이어졌는지를 빨리 아는 자료구조는 무엇인가요?"
CORRECTNESS:
  - "길이(폭의 합)가 가장 짧은 길이 폭이 가장 넓은 길인가요? 길이를 더하는 다익스트라를 그대로 쓸 수 있나요?"
  - "그래프에 방향이 있나요? 간선을 한쪽으로만 쓰면 무엇을 놓치나요?"
COMPLEXITY:
  - "서로 다른 폭마다 BFS 를 다시 하면 간선 20 만에서 몇 걸음인가요?"

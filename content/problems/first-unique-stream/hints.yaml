# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "한 번만 나온 글자들을 들어온 순서대로 들고 있으려면 어떤 자료구조가 맞나요? 답은 그 어디에 있나요?"
CORRECTNESS:
  - "새 글자가 들어와 큐 맨 앞의 글자가 두 번째로 나왔다면, 그다음 맨 앞의 글자도 이미 외톨이가 아닐 수 있나요? 몇 개를 빼야 하나요?"
EDGE_CASES:
  - "한 번 외톨이가 아니게 된 글자가 다시 외톨이가 될 수 있나요? 외톨이가 하나도 없으면 무엇을 적나요?"

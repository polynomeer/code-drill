# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "3 과 4 는 각각 어느 방향인가요? 격자 밖을 가리키는 화살표는 어떻게 되나요?"
MODELING:
  - "칸에서 이웃으로 가는 길마다 비용을 매긴다면, 화살표 방향과 그 밖의 방향은 각각 얼마인가요? 그러면 이 문제는 어떤 그래프 문제인가요?"
ALGORITHM_CHOICE:
  - "간선의 무게가 0 과 1 뿐이면 우선순위 큐 없이 덱 하나로 다익스트라를 대신할 수 있습니다. 무게 0 으로 줄어든 칸은 덱의 어느 쪽에 넣나요?"
CORRECTNESS:
  - "무게 1 로 먼저 닿은 칸에 나중에 더 싼 길이 올 수 있나요? 칸을 처음 넣을 때 방문을 확정해도 되나요?"

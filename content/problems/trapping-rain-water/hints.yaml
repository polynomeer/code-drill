MODELING:
  - "한 칸에 고이는 물의 높이를 그 칸의 왼쪽과 오른쪽만으로 정의해 보세요. 어느 쪽 벽이 물의 높이를 정합니까."
  - "왼쪽에서 가장 높은 것과 오른쪽에서 가장 높은 것 중 낮은 쪽이 물의 높이입니다. 그 값에서 칸의 높이를 뺀 것이 그 칸의 물이고, 음수는 0 입니다."

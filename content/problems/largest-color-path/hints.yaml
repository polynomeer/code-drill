# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "어느 색이 가장 많을지는 경로가 끝나야 압니다. 정점마다 한 색만이 아니라 모든 색의 개수를 들고 가면 어떨까요?"
  - "정점에서 끝나는 경로들에 대해 색마다 가장 많이 모을 수 있는 개수를 적어 두면, 다음 정점은 앞 정점들의 칸을 칸마다 큰 값으로 합치고 자기 색을 하나 더합니다."
ALGORITHM_CHOICE:
  - "경로를 하나씩 따라가면 갈래가 겹칠수록 곱으로 불어납니다. 앞 정점이 모두 끝난 뒤에 합치는 순서를 무엇이 주나요?"
  - "들어오는 간선이 없는 정점부터 꺼내는 순서라면, 꺼낸 정점의 칸은 다시 바뀌지 않습니다."
EDGE_CASES:
  - "순환이 있으면 답이 정해지지 않습니다. 그 순서가 모든 정점을 꺼냈는지 어떻게 알 수 있나요?"
  - "두 갈래가 다시 만나는 것과 순환은 다릅니다. 이미 본 정점을 다시 만났다는 것만으로는 순환이 아닙니다."

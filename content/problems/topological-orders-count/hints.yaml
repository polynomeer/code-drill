# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "순서를 앞에서부터 놓아 간다면, 다음에 무엇을 놓을 수 있는지는 무엇에만 달려 있나요? 놓은 순서인가요, 놓은 집합인가요?"
ALGORITHM_CHOICE:
  - "정점이 18 개뿐입니다. 놓은 정점의 집합을 비트로 나타내면 몇 가지인가요? 집합마다 놓는 방법의 수를 들 수 있나요?"
CORRECTNESS:
  - "Kahn 알고리즘으로 순서 하나를 만들며 매번 고를 수 있는 정점의 수를 곱하면 맞나요? 0 → 1 과 2 → 3 만 있는 그래프로 세어 보세요."
  - "방법의 수는 얼마나 커지나요? 13! 은 Int 에 드나요?"
COMPLEXITY:
  - "순서를 하나씩 만들어 세면 간선이 없는 18 정점에서 몇 가지를 만드나요?"

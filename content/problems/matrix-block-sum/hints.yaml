# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "1차원 누적합에서 구간 합은 두 값의 차였습니다. 2차원에서 직사각형 합은 몇 개의 값으로 되나요."
  - "왼쪽 위에서 (r, c) 까지의 합을 표로 두면, 직사각형은 큰 것에서 위쪽과 왼쪽을 빼고 두 번 뺀 모서리를 다시 더한 것입니다."
IMPLEMENTATION:
  - "표를 격자보다 한 줄, 한 칸 크게 잡고 0 행·0 열을 0 으로 두면 경계 검사가 사라집니다."
  - "블록이 격자 밖으로 나가면 좌표를 안으로 조이세요. 아래·오른쪽 경계는 포함이므로 +1 이 필요한 자리가 있습니다."
COMPLEXITY:
  - "칸마다 (2k+1)² 개를 더하면 500 × 500 × 501² 입니다. 누적합이면 칸마다 네 값입니다."
EDGE_CASES:
  - "k 가 격자보다 크면 모든 칸이 전체 합입니다. k 가 0 이면 자기 자신입니다."

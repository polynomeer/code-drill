# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "가장 싼 길이 편 수 제한을 넘을 수 있습니다. 06 번 경계 사례가 그것입니다. 그러면 \"가장 싼 길\"이 아니라 무엇을 구해야 하나요."
  - "\"편 수 i 이하로 갈 때 도시별 최소 요금\"을 i 를 하나씩 늘려 가며 구해 보세요. i 에서 i+1 로 갈 때 항공편 하나를 더 타는 것입니다."
ALGORITHM_CHOICE:
  - "다익스트라는 요금이 가장 싼 순서로 확정하므로 편 수를 세지 못합니다. 반복 횟수를 제한할 수 있는 알고리즘이 무엇입니까."
CORRECTNESS:
  - "한 반복 안에서 방금 갱신한 값을 이어 쓰면 그 반복에서 두 편을 탄 셈입니다. 04 번 경계 사례를 손으로 돌려 보세요. 이전 반복의 표를 따로 두세요."
  - "경유 k 번은 항공편 k+1 편입니다. 반복을 몇 번 해야 하나요."
EDGE_CASES:
  - "닿을 수 없으면 -1 입니다. 목적지에 처음 닿았다고 멈추면 더 많은 편으로 더 싼 길을 놓칩니다."

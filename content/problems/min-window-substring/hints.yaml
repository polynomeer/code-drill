# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "창이 t 를 덮는지를 매번 다시 세면 느립니다. 글자별로 \"아직 모자란 수\"를 들고, 창에 글자가 들어오고 나갈 때 그 수만 고치세요."
  - "모자란 글자의 총수가 0 이면 덮은 것입니다. 그때 왼쪽을 줄여 가며 여전히 0 인 동안 길이를 재세요."
CORRECTNESS:
  - "t 에 같은 글자가 둘이면 창에도 둘이 있어야 합니다. 있는지만 보면 aa 를 놓칩니다."
  - "왼쪽 글자를 뺄 때 그 글자의 모자란 수가 0 을 넘어가는 순간에만 총수를 늘리세요. 필요 없는 글자를 빼는 것은 총수에 영향이 없습니다."
COMPLEXITY:
  - "시작점마다 세면 n² 입니다. 양쪽 끝이 각각 n 번만 움직이면 2n 입니다."
EDGE_CASES:
  - "t 가 비면 0. t 가 s 보다 길면 0. 대소문자는 다른 글자입니다."

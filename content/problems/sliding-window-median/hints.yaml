# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "중앙값은 '작은 절반의 최댓값'입니다. 창을 작은 절반과 큰 절반으로 나누어 들고 있으면 됩니다 — 작은 절반이 하나 더 크거나 같게."
  - "작은 절반의 최댓값과 큰 절반의 최솟값이 필요하니 최대 힙 하나, 최소 힙 하나입니다."
ALGORITHM_CHOICE:
  - "창에서 나가는 원소는 힙의 한가운데에 있을 수 있어 바로 못 지웁니다. '지울 것'으로 적어 두고 꼭대기에 올라왔을 때 걷어 내세요."
  - "그러면 힙의 크기는 믿을 수 없습니다. 살아 있는 원소 수를 따로 세어 균형을 잡으세요."
CORRECTNESS:
  - "나가는 원소가 어느 절반에 있었는지는 작은 절반의 꼭대기와 비교하면 압니다. 그 절반의 살아 있는 수를 줄이고, 꼭대기였다면 바로 걷어 내세요."
IMPLEMENTATION:
  - "힙 사이를 옮기는 원소도 꼭대기이니, 옮긴 뒤에는 그 힙의 꼭대기를 다시 걷어 내야 합니다."
EDGE_CASES:
  - "같은 값이 여러 번 나가면 '지울 것'은 집합이 아니라 개수여야 합니다. k = 1 이면 답은 배열 그대로입니다."
COMPLEXITY:
  - "원소마다 힙 연산 상수 개, 미룬 삭제는 한 번 넣은 것을 한 번 빼는 것이니 상각 O(log k) 입니다."

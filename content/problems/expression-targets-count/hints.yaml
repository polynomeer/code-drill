# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "규칙이 셋입니다 — 연산자 셋과 이어 붙이기, 앞에 0 이 오는 수는 없음, 곱셈이 먼저. 셋을 각각 어디서 처리할지 정하세요."
IMPLEMENTATION:
  - "곱셈이 먼저라는 것은 지금까지의 합에 그냥 곱할 수 없다는 뜻입니다. 마지막으로 더한 항을 따로 들고 다니다가, 곱셈이 오면 그 항을 빼고 항 × 값을 더하세요."
  - "이어 붙이기는 자리를 하나씩 늘려 가며 수를 키우는 것입니다. 첫 자리가 0 이면 한 자리에서 멈추세요."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "답이 무엇인지 문장으로 다시 써 보세요. '모든 정점이 받는 데 걸리는 시간'은 어느 정점의 시간입니까?"
  - "가장 늦게 받는 정점의 시간이 답입니다. 그리고 한 정점이라도 못 받으면 답은 시간이 아닙니다."
IMPLEMENTATION:
  - "간선은 한 방향입니다. 인접 리스트에 a→b 만 넣으세요 — 양쪽에 넣는 순간 없는 길이 생깁니다."
  - "출발점에서 각 정점까지의 최단 시간을 전부 구한 뒤, 하나라도 못 닿았으면 -1, 아니면 최댓값입니다."

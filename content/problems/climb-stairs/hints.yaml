# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# 여기 없는 역량은 사다리가 문제 데이터에서 만들어진다 — 목표 복잡도는 catalog.yaml 에,
# "여기서 흔히 무너진다"는 mutants/ 의 설명 줄에 이미 있다. 같은 사실을 두 곳에 쓰지
# 않는다 (HintLadder).
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.


MODELING:
  - "n 번째 계단에 도착하는 마지막 한 걸음은 1칸이거나 2칸입니다. 그 둘을 각각 어디서 출발한 것으로 볼 수 있나요."
  - "n 에 이르는 방법 수는 n-1 에 이르는 방법 수와 n-2 에 이르는 방법 수의 합입니다. 작은 것부터 채워 올라가면 같은 것을 두 번 세지 않습니다."

IMPLEMENTATION:
  - "지문이 나머지를 더할 때마다 취하라고 적어 둔 이유를 생각해 보세요."
  - "마지막에 한 번만 나머지를 취하면 그 전에 이미 넘칩니다. 그리고 직전 두 개만 있으면 되므로 배열 전체를 들고 있을 필요도 없습니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

CONSTRAINTS:
  - "원소가 음수일 수 있다는 한 줄이 이 문제의 전부입니다. 양수만 있을 때 통하던 슬라이딩 윈도우가 왜 무너지는지 작은 예로 확인하세요."
MODELING:
  - "누적합 P 위에서 P[j] - P[i] >= k 이고 j - i 가 최소인 쌍을 찾는 문제입니다."
ALGORITHM_CHOICE:
  - "i < j 인데 P[i] >= P[j] 이면 i 는 앞으로 쓸모가 없습니다 — j 가 더 가깝고 더 작습니다. 그리고 어떤 i 가 j 와 짝이 되어 답 후보가 됐으면, 그 i 는 뒤의 어떤 j 와도 더 긴 답밖에 못 만듭니다."
  - "두 관찰이 큐의 뒤와 앞에서 각각 뺄 수 있게 합니다. 큐는 누적합이 증가하는 상태로 유지됩니다."

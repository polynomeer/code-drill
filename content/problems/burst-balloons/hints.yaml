# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "\"먼저 무엇을 터뜨릴까\"로 나누면 터뜨린 뒤 이웃이 바뀌어 왼쪽과 오른쪽이 서로 얽힙니다. 거꾸로 \"이 구간에서 마지막에 터뜨릴 풍선\"을 고르면 어떻게 되나요."
  - "마지막에 터뜨릴 풍선의 양옆은 구간 바깥의 경계라 고정입니다. 그러면 왼쪽 구간과 오른쪽 구간이 독립입니다."
ALGORITHM_CHOICE:
  - "구간의 답이 더 짧은 두 구간의 답으로 정해집니다. 짧은 구간부터 채우는 것이 구간 DP 입니다. 회문 부분 문자열과 같은 채우기 순서입니다."
CORRECTNESS:
  - "양 끝에 1 을 붙이면 경계가 사라집니다. 마지막 풍선 후보는 구간 안의 모든 풍선입니다 — 끝 풍선도요."
COMPLEXITY:
  - "구간이 n² 개, 구간마다 마지막 풍선 후보가 n 개입니다. n = 300 이면 2700 만입니다. 기억 없이 재귀하면 얼마입니까."

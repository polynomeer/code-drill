# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "나머지 세계에는 나눗셈이 없습니다. 나누는 대신 곱해서 1 이 되는 수를 찾는다고 생각해 보세요."
  - "질의마다 필요한 것은 세 개의 팩토리얼뿐입니다. 질의가 달라도 그 셋은 같은 표에서 나옵니다."
ALGORITHM_CHOICE:
  - "질의 수와 n 이 각각 십만 단위입니다. 질의마다 n 번 곱하면 곱셈이 백억 번입니다."
CONSTRAINTS:
  - "고를 개수가 가진 개수보다 클 수 있습니다. 그때 표의 어느 자리를 읽게 되는지 확인하세요."
OPTIMIZATION:
  - "역원을 질의마다 구하면 로그가 붙습니다. 가장 큰 것 하나만 구하고 거꾸로 훑어 나머지를 얻을 수 있습니다."

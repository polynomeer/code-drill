# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "가운데 원소 j 를 정하면, 그 j 를 가운데로 하는 세 쌍은 몇 개인가요? 어떤 두 개수의 곱인가요?"
ALGORITHM_CHOICE:
  - "원소마다 '왼쪽에서 나보다 작은 수'를 세는 문제는 어떤 유명한 문제와 닮았나요? 병합 정렬로 내려갈 때 무엇을 더하면 되나요?"
  - "오른쪽에서 나보다 큰 수는, 배열을 어떻게 바꾸면 같은 함수로 셀 수 있나요?"
EDGE_CASES:
  - "같은 값은 늘어나는 것인가요? 병합할 때 같은 값을 어느 쪽부터 내리면 세지 않게 되나요?"
  - "세 쌍은 얼마까지 될 수 있나요? 곱을 Int 로 해도 되나요?"
COMPLEXITY:
  - "가운데마다 양쪽을 다 훑으면 20 만에서 몇 번의 비교인가요?"

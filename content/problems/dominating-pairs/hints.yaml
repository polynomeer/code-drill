# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "기준이 등번호와 y 둘뿐이라면 어떤 문제인가요? 기준이 하나 늘면 무엇이 어려워지나요?"
ALGORITHM_CHOICE:
  - "등번호로 반을 가르면, 왼쪽 반의 i 와 오른쪽 반의 j 사이에서는 어떤 기준이 저절로 맞나요? 남은 두 기준으로 가로지르는 쌍을 어떻게 세나요?"
  - "y 로 정렬된 두 반에서 z 가 작은 개수를 빨리 세려면 어떤 자료구조를 쓰나요? 쓴 뒤에는 어떻게 비우나요?"
EDGE_CASES:
  - "쌍은 몇 개까지 될 수 있나요? Int 에 드나요?"
COMPLEXITY:
  - "쌍을 모두 보면 20 만 명에서 몇 번인가요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "답은 간선 수가 아니라 칸 수입니다 — 시작과 끝을 포함합니다. 칸이 하나면 1 입니다. 움직임은 대각선을 포함한 8 방향입니다."
MODELING:
  - "모든 움직임의 비용이 1 이니 BFS 가 최단입니다. 처음 닿았을 때의 거리가 답이라 큐에 넣을 때 거리를 적으세요."
ALGORITHM_CHOICE:
  - "8 방향은 dr, dc 각각 −1, 0, 1 의 아홉 조합에서 (0, 0) 을 뺀 것입니다. 목적지를 꺼내는 순간 답입니다."
EDGE_CASES:
  - "시작이나 끝이 막혀 있으면 −1 입니다. 끝만 따로 검사하지 않으면 막힌 끝 칸으로 들어갑니다."

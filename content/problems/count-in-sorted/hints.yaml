# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "같은 값이 여러 번 나올 수 있습니다. 정렬된 배열에서 같은 값들은 어디에 모여 있나요?"
ALGORITHM_CHOICE:
  - "그 값이 처음 나오는 자리와, 그 값보다 큰 값이 처음 나오는 자리를 알면 개수는 무엇인가요? 두 자리는 각각 어떻게 찾나요?"
COMPLEXITY:
  - "하나를 찾은 뒤 양옆으로 세면, 배열이 전부 같은 값이고 질문이 20 만 개일 때 몇 걸음인가요?"
EDGE_CASES:
  - "값이 모든 원소보다 크면 '처음 나오는 자리'는 어디인가요? 그 자리의 원소를 읽어도 되나요?"

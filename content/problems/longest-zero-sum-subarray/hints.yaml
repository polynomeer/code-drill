# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "구간의 합을 접두사 합의 차로 바꿔 쓰면, 찾는 조건이 '두 접두사 합이 같다' 가 됩니다."
  - "같은 값을 다시 만났을 때 필요한 것은 그 값이 '처음' 나온 자리입니다. 왜 처음인지 말해 보세요."
ALGORITHM_CHOICE:
  - "모든 구간을 더해 보면 이십만 개에서 두 겹입니다. 값을 자리로 바꿔 주는 자료구조를 쓰세요."
EDGE_CASES:
  - "맨 앞에서 시작하는 구간은 어떻게 잡히나요? 빈 접두사를 표에 미리 넣어 두면 특별 취급이 필요 없습니다."

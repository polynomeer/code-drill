# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "다음 학기에 들을 수 있는 과목은 무엇에만 달려 있나요? 들은 순서인가요, 들은 집합인가요?"
ALGORITHM_CHOICE:
  - "과목이 15 개뿐입니다. 들은 집합을 비트로 나타내면 몇 가지인가요? 집합마다 최소 학기를 들 수 있나요?"
CORRECTNESS:
  - "들을 수 있는 과목 가운데 번호가 작은 k 개를 고르면 언제나 최적인가요? 사슬 5 → 4 → 3 → 2 와 외톨이 과목 0, 1 에서 k = 2 로 해 보세요."
  - "들을 수 있는 과목이 k 개 이하라면 그중 일부만 들을 이유가 있나요?"
COMPLEXITY:
  - "들은 집합을 기억하지 않고 고를 수 있는 모든 조합을 따라가면 갈래가 몇 개로 늘어나나요?"

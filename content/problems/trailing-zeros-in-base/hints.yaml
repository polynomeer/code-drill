# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "끝자리 0 의 개수는 n! 을 base 로 몇 번 나눌 수 있는가와 같습니다. base 를 소인수분해하면 무엇을 세면 되나요?"
  - "base 가 p 를 e 번 품고 있다면, n! 에 든 p 의 개수를 e 로 나눈 몫이 그 소인수가 허락하는 횟수입니다. 소인수마다 그 값 중 무엇이 답인가요?"
EDGE_CASES:
  - "n 이 20 억이면 p 의 거듭제곱을 곱해 나가다 Int 를 넘깁니다. 거듭제곱 대신 n 을 거듭 나눠 보세요."

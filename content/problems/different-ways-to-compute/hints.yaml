# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "다른 괄호가 같은 값을 내면 그 값은 여러 번 들어갑니다. 결과는 집합이 아니라 다중집합이고, 오름차순입니다."
MODELING:
  - "괄호를 넣는다는 것은 '마지막에 계산되는 연산자'를 고르는 것입니다. 그 연산자에서 식을 자르면 왼쪽과 오른쪽은 각각 더 작은 같은 문제입니다."
  - "왼쪽의 모든 값과 오른쪽의 모든 값의 조합이 이 연산자에서의 결과입니다. 숫자 하나는 값 하나입니다."
CORRECTNESS:
  - "모든 연산자에서 잘라야 합니다. 첫 연산자에서만 자르면 왼쪽이 먼저 계산되는 괄호만 셉니다."
  - "빼기는 순서가 있습니다. 왼쪽 값에서 오른쪽 값을 빼세요."
IMPLEMENTATION:
  - "연산자가 없는 구간은 숫자 하나입니다. 그 경우가 재귀의 바닥입니다."
  - "같은 구간이 여러 번 나오니 구간을 기억하면 빨라지지만, 이 제약에서는 없이도 통과합니다."
EDGE_CASES:
  - "식이 숫자 하나면 결과도 그 숫자 하나입니다."

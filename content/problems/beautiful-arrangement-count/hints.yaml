# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "자리 1 부터 채워 나가며 그 자리에 올 수 있는 값(자리를 나누거나 자리로 나뉘는 값)만 시도하세요. 조건이 자리마다 독립이라 앞에서 어긴 것은 뒤에서 고칠 수 없습니다."
CORRECTNESS:
  - "조건은 양쪽입니다 — perm[i] % i == 0 또는 i % perm[i] == 0. 한쪽만 보면 놓칩니다. 되돌아올 때 사용 표시를 지워야 다른 가지가 삽니다."
OPTIMIZATION:
  - "순열을 다 만든 뒤 검사하면 15! 입니다. 자리마다 가능한 값만 내려가면 가지가 급격히 줄어 15 에서도 수십만 번입니다."
  - "더 줄이려면 '어떤 값을 썼는가'(비트 집합)로 기억하세요 — 같은 집합이면 남은 자리가 같아 답이 같습니다."
COMPLEXITY:
  - "가지치기의 비용은 정확히 세기 어렵지만, 자리 i 에 올 수 있는 값은 i 의 약수와 배수뿐이라 n 보다 훨씬 적습니다."

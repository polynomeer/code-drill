# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "답은 '모순되지 않는 배열 중 보통의 a..z 사전순으로 가장 앞선 것'입니다. 정보가 없는 글자들은 a..z 순으로 나옵니다."
  - "모순은 둘입니다 — 순서에 순환이 있거나, 앞 단어가 뒤 단어의 접두사인데 더 길거나."
MODELING:
  - "인접한 두 단어에서 처음으로 다른 글자 쌍 하나만 '앞 < 뒤' 를 줍니다. 그 뒤의 글자들은 아무 정보가 없습니다."
  - "그 관계들이 방향 간선이고, 답은 그 그래프의 위상 정렬입니다."
ALGORITHM_CHOICE:
  - "들어오는 간선이 없는 글자를 뽑을 때 최소 힙을 쓰면 사전순 최소 위상 정렬입니다. 보통 큐면 순서가 등록 순서에 끌려갑니다."
EDGE_CASES:
  - "같은 간선이 여러 쌍에서 나올 수 있습니다. 진입 차수를 두 번 올리면 그 글자가 영원히 나오지 않습니다. 앞 단어가 뒤 단어보다 길고 뒤 단어가 앞 단어의 접두사면 빈 문자열입니다."
CORRECTNESS:
  - "다 뽑았을 때 글자 수가 전체 글자 수보다 적으면 순환입니다 — 빈 문자열."

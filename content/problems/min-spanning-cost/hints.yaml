# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

ALGORITHM_CHOICE:
  - "간선을 싼 것부터 보는 것은 맞는 출발입니다. 그런데 싼 간선 n-1 개를 그냥 더하면 왜 틀릴까요. 07 번 경계 사례를 보세요."
  - "싼 간선이라도 이미 이어진 두 정점을 또 잇는 것이면 버려야 합니다. 그것을 빠르게 판단하는 구조가 이전 문제 (중복 간선 찾기) 에 있었습니다."
CORRECTNESS:
  - "정점이 하나면 간선이 없어도 답은 0 입니다. 정점이 둘인데 간선이 없으면요."
  - "간선을 다 보고도 n-1 개를 고르지 못했다면 이을 수 없는 것입니다. 그때 지금까지의 비용을 돌려주면 안 됩니다."
COMPLEXITY:
  - "간선을 고를 때마다 지금까지 고른 간선으로 두 정점이 이어졌는지 탐색하면 간선 수 곱하기 정점 수입니다. 60 만 곱하기 10 만은 얼마입니까."
  - "정렬 한 번에 거의 상수 시간의 판단 60 만 번이면 충분합니다. 경로 압축을 넣으세요."
EDGE_CASES:
  - "같은 두 정점 사이의 간선이 여럿이면 어느 것을 쓰나요. 자기 자신을 잇는 간선은 무엇을 잇나요."
  - "둘 다 유니온 파인드가 저절로 처리합니다 — 같은 묶음이면 버린다. 따로 걸러낼 필요가 없다는 것을 확인하세요."

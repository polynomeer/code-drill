# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "누가 누구에게 줬는지를 지우고 사람마다 잔액만 남겨 보세요. 잔액이 0 이 아닌 사람이 k 명이면, 언제나 k − 1 번으로 끝낼 수 있나요?"
  - "잔액의 합이 0 인 무리 둘로 쪼갤 수 있으면 송금이 몇 번 드나요? 무리가 m 개면요?"
ALGORITHM_CHOICE:
  - "k 가 20 이하입니다. 사람들의 부분집합을 비트 하나씩으로 나타내면 몇 개인가요? 부분집합마다 \"합이 0 인 무리로 가장 많이 쪼갠 수\"를 구할 수 있나요?"
COMPLEXITY:
  - "앞사람의 잔액을 부호가 반대인 뒷사람에게 넘겨 보는 백트래킹은, 쪼갤 수 없는 잔액이 스무 명이면 몇 갈래를 보나요?"
CORRECTNESS:
  - "금액이 딱 맞는 두 사람을 먼저 짝지으면, 남은 사람들은 언제나 한 줄로 세워야 하나요? 남은 사람들도 무리로 쪼개질 수 있지 않나요?"
  - "빈 부분집합도 합이 0 입니다. 그것을 무리로 세면 답이 어떻게 되나요?"

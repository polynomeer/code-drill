# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "정점 0 을 루트로 잡으면 간선 하나는 무엇으로 나타낼 수 있나요? 그 간선을 끊으면 떨어져 나가는 것은 무엇인가요?"
  - "서브트리 XOR 을 모두 알 때, 간선 둘을 끊은 세 조각의 XOR 은 어떤 경우로 나뉘나요?"
CORRECTNESS:
  - "두 간선의 아래쪽 정점 a, b 가 조상–자손이면 위쪽 서브트리의 XOR 에 아래쪽이 이미 들어 있습니다. 그 몫을 어떻게 빼나요?"
  - "b 가 a 의 자손인지만 보았나요? 번호가 큰 쪽이 조상일 수도 있습니다."
EDGE_CASES:
  - "진입 시각 구간 [tin, tout) 의 끝은 포함인가요? 서브트리 바로 다음에 들어간 정점은 자손인가요?"
COMPLEXITY:
  - "간선 쌍은 200 만 개입니다. 쌍마다 세 조각을 다시 훑으면 몇 걸음인가요? 쌍마다 상수 시간에 끝내려면 무엇을 미리 구해 두어야 하나요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "한 정점의 답을 알 때 그 이웃의 답이 얼마나 달라지는지 세어 보세요. 가까워지는 정점과 멀어지는 정점의 수가 답입니다."
  - "루트에서의 답은 깊이의 합입니다. 나머지는 거기서 옮겨 가며 고칩니다."
CORRECTNESS:
  - "부모에서 자식으로 옮길 때 가까워지는 것은 자식의 서브트리 안이고, 나머지는 전부 멀어집니다. 두 수의 합이 n 이어야 합니다."
OPTIMIZATION:
  - "정점마다 탐색하면 n² 입니다. 이미 구한 답을 다시 쓰는 방법을 찾으세요."
COMPLEXITY:
  - "parent[i] < i 라 배열을 뒤에서 앞으로, 앞에서 뒤로 한 번씩 훑으면 재귀 없이 끝납니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "돌아오는 길을 뒤집으면 또 하나의 내려가는 길입니다. 그러면 문제는 두 사람이 (0, 0) 에서 동시에 출발해 같은 걸음 수로 내려가는 것입니다."
  - "걸음 수 t 에서 사람의 행 r 을 알면 열은 t − r 입니다. 상태는 (t, r1, r2) 셋이면 충분합니다."
ALGORITHM_CHOICE:
  - "t 마다 (r1, r2) 표를 만듭니다. 각 칸은 이전 걸음의 네 조합(둘 다 위에서·왼쪽에서) 중 최대에 이 걸음에서 줍는 체리를 더한 것입니다."
CORRECTNESS:
  - "두 사람이 같은 칸에 있으면 체리는 한 번만 셉니다. 가시 칸은 상태에서 빼고, 네 조합 중 어느 것도 닿지 못하면 그 상태도 닿지 못한 것입니다."
COUNTEREXAMPLE:
  - "내려가며 최대로 줍고 돌아오며 최대로 줍는 풀이의 반례를 만들어 보세요 — 첫 길이 체리를 흩어 줍고 나면 둘째 길이 빈손인 격자입니다."
COMPLEXITY:
  - "걸음 2n 개 × (r1, r2) n² — O(n³) 입니다. 좌표 넷으로 상태를 두면 n⁴ 입니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "'사전순으로 가장 앞선 순서'는 배열을 앞에서부터 비교했을 때 가장 작은 것입니다. 첫 원소가 작은 것이 먼저이고, 같으면 둘째를 봅니다."
  - "그래서 매 순간 '지금 들을 수 있는 과목 중 번호가 가장 작은 것'을 들어야 합니다. 들을 수 있는 것이 여럿이면 어느 것을 골라도 유효하지만, 가장 작은 것만이 사전순입니다."
IMPLEMENTATION:
  - "과목마다 아직 안 들은 선수 과목 수를 세어 두세요. 0 인 과목이 지금 들을 수 있는 과목입니다."
  - "들을 수 있는 과목들 중 가장 작은 것을 빨리 꺼내야 합니다. 선입선출 큐는 그것을 보장하지 않습니다."

# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "한 정점의 서브트리 크기는 무엇으로 정해집니까. 자식들의 값으로 적어 보세요."
  - "자기 자신 1 에 자식들의 서브트리 크기를 더한 것입니다. 그러니 자식이 부모보다 먼저 끝나야 하고, 깊은 정점부터 처리하면 그 순서가 보장됩니다."

IMPLEMENTATION:
  - "부모 배열은 자식이 부모보다 앞에 올 수 있습니다. 배열 순서를 믿지 말고 깊이를 먼저 구하세요."
  - "깊이 내림차순으로 정점을 늘어놓고 각 정점의 크기를 부모에 더하면, 부모 차례가 왔을 때 자식이 전부 더해져 있습니다."

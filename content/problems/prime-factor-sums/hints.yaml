# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

CONSTRAINTS:
  - "값이 10 억까지입니다. 2 부터 n 까지 나눠 보면 수 하나에 몇 번입니까. 수는 2000 개입니다."
  - "p × p 가 n 보다 크면 남은 n 에 p 이상의 인수가 둘일 수 없습니다. 어디까지만 나누면 되나요."
CORRECTNESS:
  - "√n 까지 나눈 뒤 남은 n 이 1 보다 크면 그것도 소인수입니다. 999999937 의 답은 무엇입니까."
  - "같은 소인수는 한 번만 더합니다. 12 = 2·2·3 의 답은 5 입니다."
COMPLEXITY:
  - "소인수를 찾을 때마다 그것으로 n 을 다 나누세요. 그러면 다음에 나누어떨어지는 수는 저절로 소수이고, n 이 작아져 √n 도 작아집니다."
EDGE_CASES:
  - "p × p 를 Int 로 계산하면 p 가 46341 을 넘을 때 넘칩니다. Long 으로 하거나 p 를 n / p 와 비교하세요."

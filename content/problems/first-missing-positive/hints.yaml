# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "길이가 n 이면 답은 1..n+1 을 벗어날 수 없습니다. 왜 그런지 말로 해 보면 볼 값이 확 줄어듭니다."
  - "배열 자신을 '값 v 는 v-1 번 자리' 라는 표로 쓸 수 있습니다. 자리와 값이 어긋난 첫 곳이 답입니다."
CONSTRAINTS:
  - "범위 밖의 값(음수, 0, n 보다 큰 수)은 답을 밀어내지 못합니다. 그 값들을 어떻게 다룰지 먼저 정하세요."
EDGE_CASES:
  - "중복이 있으면 자리를 맞바꾸다 제자리를 맴돌 수 있습니다. 보낼 자리에 이미 같은 값이 있으면 멈추세요."
  - "1..n 이 빠짐없이 들어 있는 입력에서 답이 무엇인지 확인하세요."
OPTIMIZATION:
  - "집합을 만들면 쉽지만 공간이 n 입니다. 배열을 고쳐도 된다면 그 공간을 없앨 수 있습니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "첫째와 둘째 자리를 바꿀 수 있고 둘째와 셋째 자리를 바꿀 수 있다면, 첫째와 셋째 자리의 글자도 서로 옮길 수 있나요?"
  - "맞바꿀 수 있는 자리들은 무리를 이룹니다. 한 무리 안에서는 글자를 어떤 순서로든 늘어놓을 수 있습니다. 그러면 가장 앞선 배치는 무엇인가요?"
IMPLEMENTATION:
  - "무리를 묶을 때는 두 자리의 뿌리끼리 이어야 합니다. 자리 자체를 이으면 그 자리가 원래 속했던 무리와의 연결이 끊깁니다."
  - "무리마다 글자를 정렬해 두고, 그 무리의 자리를 앞에서부터 채우세요."

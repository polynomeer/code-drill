# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

READING:
  - "0 은 어떤 글자도 아닙니다. 그러면 0 이 나올 수 있는 자리는 어디뿐인가요. 10 과 20 을 보세요."
  - "빈 문자열의 답은 0 이라고 문제가 정합니다."
MODELING:
  - "마지막 자리가 어떻게 해독되는지 두 경우로 나눠 보세요 — 혼자서, 또는 앞 자리와 함께. 각 경우 남는 것은 무엇입니까."
  - "계단 오르기와 같은 식입니다. 다만 한 칸이 되려면 0 이 아니어야 하고, 두 칸이 되려면 10~26 이어야 합니다."
EDGE_CASES:
  - "\"06\" 은 0 입니다 — 6 이 아닙니다. \"27\" 은 1 입니다. \"30\" 은 0 입니다. 손으로 돌려 보세요."
COMPLEXITY:
  - "재귀로 두 갈래를 뻗으면 같은 자리를 여러 번 풉니다. 10 만 자리면 얼마입니까. 앞에서부터 두 값만 들고 가면 됩니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

CONSTRAINTS:
  - "n 이 2 만이면 쌍이 2 억 개입니다. 만들어 정렬할 수 있는 수입니까? 값의 범위는 100 만입니다 — 답의 후보는 그만큼뿐입니다."
ALGORITHM_CHOICE:
  - "'거리가 d 이하인 쌍이 몇 개인가'는 d 가 커질수록 늘어납니다. 그런 함수에서 k 번째를 찾는 것은 d 를 이분 탐색하는 것입니다."
  - "정렬된 배열에서 d 이하인 쌍의 수는 두 포인터로 한 번에 셉니다. 오른쪽을 늘리며 왼쪽을 따라 밀면 됩니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "따라잡으면 앞차 속도로 붙습니다 — 그 뒤로 앞차와 뒤차는 하나입니다. 목적지에서 정확히 따라잡아도 같은 무리입니다."
MODELING:
  - "차마다 혼자 달렸을 때 목적지까지 걸리는 시간을 재 보세요. 뒤차의 시간이 앞차의 시간보다 작거나 같으면 목적지 전에 따라잡습니다."
  - "목적지에 가까운 차부터 보세요. 무리의 시간은 그 무리에서 가장 느린 차(맨 앞)의 시간이고, 뒤차는 그 시간과 비교합니다 — 바로 앞차가 아니라."
CORRECTNESS:
  - "시간은 실수입니다. 정수 나눗셈으로 재면 갈라야 할 무리가 합쳐집니다. 입력 순서는 위치 순서가 아니니 위치로 정렬합니다."
EDGE_CASES:
  - "차가 하나면 1 입니다. 모두 같은 속도면 아무도 못 따라잡습니다."

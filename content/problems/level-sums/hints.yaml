# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "답의 칸 하나는 깊이 하나입니다. 정점마다 자기 깊이만 알면 그 칸에 값을 더하면 됩니다."
  - "깊이는 루트까지 올라간 횟수입니다. 한 번 정한 깊이를 적어 두면, 올라가다 이미 정해진 정점을 만나는 순간 멈출 수 있습니다."

IMPLEMENTATION:
  - "배열 순서대로 부모의 깊이에 1 을 더하는 방법은 부모가 먼저 나온다는 약속이 있어야 합니다. 그 약속은 없습니다."
  - "정점에서 출발해 정해지지 않은 정점을 지나며 올라간 경로를 기억해 두고, 멈춘 자리에서 거꾸로 내려오며 깊이를 매기세요."

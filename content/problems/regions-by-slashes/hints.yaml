# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "빗금은 칸을 둘로 나눕니다. 칸을 두 대각선으로 넷으로 나눠 두면, '/' 와 '\\' 와 빈칸은 각각 네 조각 중 어느 것들을 잇나요?"
  - "칸의 오른쪽 조각과 오른쪽 칸의 왼쪽 조각은 무엇이 있든 이어져 있나요?"
IMPLEMENTATION:
  - "조각마다 번호를 매기고 이어진 조각을 한 무리로 묶는다면, 마지막에 세는 것은 무엇인가요?"
EDGE_CASES:
  - "칸을 2×2 픽셀로 그려 빈 픽셀을 칠하면 '//' 와 '/ ' 두 줄에서 영역이 몇 개로 보이나요? 실제로는 몇 개인가요?"

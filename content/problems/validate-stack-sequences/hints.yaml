# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "실제로 스택을 하나 두고 해 보면 어떨까요? 언제 꺼내는 것이 손해가 없나요?"
  - "맨 위가 지금 꺼낼 차례의 값이면 꺼냅니다. 값이 모두 다르니 미룰 이유가 없습니다."
IMPLEMENTATION:
  - "값을 하나 넣은 뒤에 꺼낼 수 있는 것이 하나뿐인가요? 연달아 꺼낼 수도 있습니다."
EDGE_CASES:
  - "다 넣고 나서 끝내 꺼내지 못한 값이 남는 경우, 답은 무엇인가요?"

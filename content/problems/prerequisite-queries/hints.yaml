# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "질의가 10 만이고 그래프가 만 개면 질의마다 탐색은 10 억입니다. 답을 미리 다 만들어 두면 질의는 조회입니다 — '어떤 정점에서 v 로 올 수 있는가'를 정점마다 집합으로."
ALGORITHM_CHOICE:
  - "위상 순서로 앞에서부터 가면 v 의 도달원 집합 = 직전 정점들의 집합 ∪ 직전 정점들 입니다. 직전 정점의 집합이 먼저 완성돼 있어야 하니 순서가 위상 순서여야 합니다."
CONSTRAINTS:
  - "집합을 비트로 두면 n = 2000 에 워드 32 개입니다. 집합 합치기가 워드 수만큼이라 전체가 간선 수 × 32 입니다."
OPTIMIZATION:
  - "번호 순으로 처리하면 안 됩니다 — 간선이 번호 역순일 수 있습니다. 위상 순서를 먼저 만드세요."

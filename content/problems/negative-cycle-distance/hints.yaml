# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "거리를 '지금까지 아는 가장 싼 값'으로 두고, 간선 하나가 그 값을 줄일 수 있는지만 보세요. 줄일 수 있으면 줄이는 것이 한 번의 완화입니다."
  - "단순 경로는 간선을 n-1 개보다 많이 쓸 수 없습니다. 전체 훑기를 n-1 번 하면 모든 단순 경로가 반영됩니다."
READING:
  - "답이 세 가지입니다 — 유한한 거리, 닿을 수 없음, 하한 없음. 셋을 가르는 조건을 먼저 적어 보세요."
  - "하한이 없는 정점은 음수 순환 위에 있는 정점만이 아닙니다. 그 순환에서 갈 수 있는 곳도 함께입니다."
ALGORITHM_CHOICE:
  - "가장 가까운 것부터 확정하는 방법은 '나중에 더 싸질 수 없다'에 기대고 있습니다. 음수 간선이 그 가정을 깹니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "⌊n/i⌋ 는 i 가 커질수록 작아지고, 같은 값이 구간으로 이어집니다. n = 10 이면 i = 6..10 의 몫이 전부 1 입니다."
  - "몫이 q 인 i 의 마지막은 ⌊n/q⌋ 입니다. 구간의 시작 i 에서 q = ⌊n/i⌋ 를 재고 끝을 ⌊n/q⌋ 로 잡아 q × 길이를 더하세요."
CONSTRAINTS:
  - "n 이 10 억이면 n 번 나누는 것은 안 됩니다. 구간의 수는 2√n 개 — 6 만 남짓입니다. 합은 n ln n 규모라 Long 입니다."
OPTIMIZATION:
  - "√n 까지의 i 는 몫이 다 다르고, 그 뒤는 몫이 √n 이하라 종류가 √n 개입니다. 그래서 구간이 2√n 개입니다."
CORRECTNESS:
  - "구간의 끝은 ⌊n/q⌋ 그 자체이고 다음 구간은 그 다음부터입니다. 하나 덜 잡으면 구간마다 하나씩 빠집니다."

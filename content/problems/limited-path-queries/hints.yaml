# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "limit 보다 가벼운 간선만 남긴 그래프에서 두 정점이 이어져 있는가 — 질문은 그것뿐입니다. 무엇이 이어짐을 빠르게 답하나요?"
  - "limit 이 커질수록 쓸 수 있는 간선은 늘기만 합니다. 질문을 어떤 순서로 답하면 간선을 더하기만 하면 될까요?"
ALGORITHM_CHOICE:
  - "질문마다 길을 찾으면 질문 수 곱하기 그래프 크기입니다. 질문을 미리 다 받아 두고 순서를 바꿔 답해도 되는 문제인가요?"
EDGE_CASES:
  - "간선의 무게가 limit 과 꼭 같으면 쓸 수 있나요? 그리고 답은 어떤 순서로 돌려줘야 하나요?"

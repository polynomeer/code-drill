# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "일 하나가 끝나는 시각은 무엇으로 정해지나요. 선행 일들이 끝나는 시각과 자기 시간으로 식을 세워 보세요 — 더하나요, 최댓값을 취하나요."
  - "동시에 할 수 있으므로 선행 일들 중 가장 늦게 끝나는 것을 기다립니다. 최댓값에 자기 시간을 더하는 것입니다."
ALGORITHM_CHOICE:
  - "그 식을 쓰려면 선행 일들의 값이 먼저 있어야 합니다. 어떤 순서로 돌아야 그것이 보장되나요. 학기 문제에서 쓴 순서입니다."
CORRECTNESS:
  - "번호 순서는 위상 순서가 아닙니다. 07 번 경계 사례에서 2 가 1 의 선행이고 1 이 0 의 선행입니다."
  - "같은 관계가 두 번 나오면 진입 차수도 두 번 셉니다. 그것이 왜 문제가 없는지, 또는 왜 문제인지 확인하세요."
EDGE_CASES:
  - "순환이 있으면 어떤 일은 영영 시작하지 못합니다. 위상 순서로 돈 일의 수가 n 보다 작으면 그것입니다. 관계가 하나도 없으면 답은 가장 긴 일 하나입니다."

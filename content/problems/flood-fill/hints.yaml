# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "이어진 칸은 상하좌우뿐인가요, 대각선도 드나요? 시작 칸과 같은 색이어도 이어지지 않은 칸은 바뀌나요?"
IMPLEMENTATION:
  - "시작 칸에서 같은 색 이웃으로 퍼져 나가려면 무엇을 기억해 두어야 하나요? 칠한 칸에 다시 들어가지 않게 하는 방법은 무엇인가요?"
EDGE_CASES:
  - "새 색이 원래 색과 같으면 칠한 칸과 안 칠한 칸을 구별할 수 있나요?"
  - "칸 하나 폭으로 25 만 칸을 도는 길이라면 재귀의 깊이는 얼마인가요?"

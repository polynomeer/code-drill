# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "a × b 가 k 의 배수인지는 a, b 의 어느 부분에만 달려 있나요? gcd(a, k) 와 gcd(b, k) 로 말할 수 있나요?"
  - "gcd(v, k) 는 k 의 무엇인가요? 그런 값은 많아야 몇 가지인가요?"
CORRECTNESS:
  - "둘 중 하나가 k 의 배수여야 곱이 배수인가요? 4 × 6 과 12 는요?"
  - "같은 무리 안에서 쌍은 몇 개인가요? 원소를 자기 자신과 짝지어도 되나요?"
EDGE_CASES:
  - "k 가 10 만에 가깝다면 약수 둘의 곱은 Int 에 드나요?"
COMPLEXITY:
  - "쌍을 모두 보면 10 만 원소에서 몇 쌍인가요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "φ(k) = k × Π(1 − 1/p) 입니다. p 는 k 의 서로 다른 소인수입니다. 소수마다 '그 배수 전부'에 1 − 1/p 를 곱하는 것으로 읽어 보세요."
  - "배열 phi 를 phi[k] = k 로 시작하고, 소수 p 를 찾을 때마다 p 의 배수 k 에서 phi[k] 에서 phi[k] / p 를 빼면 정확히 그 곱입니다."
CORRECTNESS:
  - "phi[k] −= phi[k] / p 는 현재 값에서 빼는 것이라 소인수가 여럿이어도 맞습니다. 원래 k 에서 매번 새로 계산하면 앞의 소인수가 지워집니다."
  - "phi[p] == p 이면 p 는 아직 어떤 소수에도 걸리지 않은 것 — 소수입니다. 따로 체를 둘 필요가 없습니다."
OPTIMIZATION:
  - "수마다 gcd 를 세는 것은 n² 입니다. 소수마다 배수를 걸르는 체는 n log log n 입니다."
CONSTRAINTS:
  - "합은 n² 규모입니다 — 10 만에서 이미 30 억으로 Int 를 넘습니다. Long 으로 더하고 나머지를 취하세요. φ(1) = 1 도 더합니다."

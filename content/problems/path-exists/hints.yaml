# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "길이 있는지만 묻는다면, 정점들을 무엇으로 나누면 되나요? 두 정점이 같은 무엇에 들면 길이 있나요?"
IMPLEMENTATION:
  - "간선 (u, v) 로 두 무리를 이을 때 무엇과 무엇을 잇나요? u 와 v 인가요, 그 대표들인가요?"
EDGE_CASES:
  - "source 와 target 이 같으면 어떻게 되나요? 정점 20 만 개가 한 줄로 이어지면 재귀 DFS 는 어떻게 되나요?"

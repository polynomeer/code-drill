# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "입력과 출력은 32 비트 패턴입니다. 맨 앞 비트가 1 인 결과는 Int 로 보면 음수입니다. 그것도 맞는 답인가요?"
IMPLEMENTATION:
  - "결과를 왼쪽으로 한 칸 밀고, n 의 맨 아래 비트를 붙이고, n 을 오른쪽으로 한 칸 미는 일을 몇 번 해야 하나요?"
EDGE_CASES:
  - "n 의 위쪽이 0 으로 차 있으면 그 0 들은 결과의 어디로 가야 하나요? 일찍 멈추면 무엇이 빠지나요?"

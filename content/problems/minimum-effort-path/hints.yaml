# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "수고는 합이 아니라 최댓값입니다. 그래서 '수고가 k 이하인 경로가 있는가'는 높이 차가 k 이하인 간선만 남긴 격자에서 도달 가능한가와 같습니다."
  - "그 답은 k 에 대해 단조입니다 — k 로 되면 더 큰 k 로도 됩니다. 단조인 예/아니오는 이분 탐색의 자리입니다."
ALGORITHM_CHOICE:
  - "k 를 0..최대 높이 차에서 이분 탐색하고, 판정은 BFS 한 번입니다. Dijkstra 의 완화를 max(지금까지, 이 간선) 으로 바꾸는 것도 같은 답입니다."
CORRECTNESS:
  - "도달하면 hi = mid, 아니면 lo = mid + 1 입니다. 도달했을 때 mid − 1 로 내리면 답을 지나칩니다."
EDGE_CASES:
  - "상하좌우 넷입니다. 오른쪽·아래로만 가면 뱀처럼 돌아가는 편한 길을 놓칩니다. 칸이 하나면 답은 0 입니다."
CONSTRAINTS:
  - "높이 차의 최댓값은 100 만입니다. 이분 탐색 20 번 × 9 만 칸이면 되고, 임계값을 하나씩 올리면 100 만 번의 BFS 입니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "조건 nums1[i] − nums1[j] <= nums2[i] − nums2[j] + diff 에서 i 에 걸린 항과 j 에 걸린 항을 한쪽씩으로 모아 보세요. 배열 하나로 줄일 수 있나요?"
ALGORITHM_CHOICE:
  - "앞의 값이 뒤의 값 + diff 이하인 쌍을 세는 것은 어떤 유명한 문제와 닮았나요? 두 반을 각각 정렬해 두면 가로지르는 쌍을 어떻게 세나요?"
EDGE_CASES:
  - "등호도 조건을 만족합니다. 포인터를 움직이는 비교에 등호가 들어 있나요?"
  - "쌍은 몇 개까지 될 수 있나요? 나머지를 취하기 전에 Int 에 드나요?"
COMPLEXITY:
  - "모든 쌍을 보면 50 만에서 몇 번의 비교인가요?"

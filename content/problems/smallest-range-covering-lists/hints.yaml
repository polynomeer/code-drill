# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "목록마다 포인터를 하나씩 두면 그 포인터들이 가리키는 값들의 [min, max] 는 모든 목록을 덮는 구간입니다. 문제는 그 구간을 가장 짧게 만드는 것입니다."
  - "구간을 줄이는 유일한 길은 min 을 키우는 것입니다 — max 는 이미 가리킨 값이라 줄일 수 없습니다. 그러니 가장 작은 값의 포인터를 앞으로 밉니다."
ALGORITHM_CHOICE:
  - "min 은 최소 힙이 줍니다. max 는 지금까지 밀어 넣은 값의 최댓값 — 따로 들고 갑니다."
CORRECTNESS:
  - "어느 목록의 포인터가 끝에 닿으면 더는 줄일 수 없으니 멈춥니다. 다만 멈추기 전에 그 상태의 구간은 봐야 합니다 — 답이 끝에 있을 수 있습니다."
EDGE_CASES:
  - "길이가 같으면 lo 가 작은 쪽입니다. 먼저 본 것이 lo 가 작으니 '더 짧을 때만' 바꾸세요. 목록이 하나면 원소 하나짜리 구간입니다."
OPTIMIZATION:
  - "매 걸음 k 개 포인터를 훑어 최솟값을 찾으면 N·k 입니다. 힙이면 N log k 입니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "줄여야 하는 것이 걸음 수인지 벽의 수인지 문장으로 다시 써 보세요. 둘은 다른 길을 고릅니다."
  - "빈 칸으로 가는 것은 비용 0, 벽으로 가는 것은 비용 1 인 그래프입니다. 비용이 두 가지뿐인 최단 경로입니다."
IMPLEMENTATION:
  - "힙을 써도 되지만 비용이 0 과 1 뿐이면 양쪽 큐로 충분합니다. 비용 0 으로 간 칸은 앞에, 1 로 간 칸은 뒤에 넣으세요."
  - "출발 칸이 벽이면 그것부터 셉니다. 칸까지의 최소 벽 수를 적어 두고, 더 적은 값이 나올 때만 고치세요."

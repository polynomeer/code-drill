# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "어떤 자리가 왼쪽 끝으로 쓸모없어지는지 생각해 보세요. 자기보다 앞에 자기 이하의 값이 이미 있다면요?"
  - "왼쪽 끝 후보는 지금까지보다 작은 값이 나온 자리뿐입니다. 그 후보들의 값은 어떤 순서로 놓이나요?"
ALGORITHM_CHOICE:
  - "왼쪽 끝마다 짝을 찾으면 짝이 없는 자리에서 나머지를 전부 봅니다. 오른쪽 끝을 어느 방향으로 옮기면 후보를 버릴 수 있을까요?"
  - "오른쪽 끝을 뒤에서부터 옮기면, 한 번 짝을 찾은 왼쪽 끝은 더 넓은 짝을 다시 얻을 수 없습니다."
CORRECTNESS:
  - "오른쪽 끝 하나가 왼쪽 끝 후보를 몇 개까지 꺼낼 수 있나요? 하나에서 멈출 이유가 있나요?"
  - "같은 값도 오르막입니다. 비교가 작거나 같음인지 확인하세요."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "자리 i 의 답은 'i 보다 뒤에 있고 값이 더 작은 원소의 수'입니다. 역전 쌍 세기에서 쌍의 총수 대신 왼쪽 원소마다 나눠 세는 것입니다."
  - "값을 정렬하면 자리를 잃습니다. 정렬할 것은 값이 아니라 자리이고, 비교만 값으로 하세요."
ALGORITHM_CHOICE:
  - "병합 정렬로 절반씩 정렬해 두면, 왼쪽 원소를 내보내는 순간 오른쪽에서 이미 나간 원소가 곧 '뒤에 있는 더 작은 수'입니다."
  - "그 수를 왼쪽 원소의 자리에 더하세요. 위 단계에서는 같은 원소가 또 다른 오른쪽을 만나 다시 더해집니다."
OPTIMIZATION:
  - "자리마다 뒤를 훑으면 10만 개에서 50억 번 비교입니다. 정렬을 한 번 하는 비용에 답을 얹을 수 있습니다."
  - "병합할 때 왼쪽 원소가 나가는 순간 오른쪽에서 먼저 나간 개수는 j 의 위치에서 바로 읽힙니다 — 세는 비용이 따로 없습니다."
CORRECTNESS:
  - "같은 값은 '더 작은' 값이 아닙니다. 왼쪽과 오른쪽의 값이 같을 때 어느 쪽을 먼저 내보내야 왼쪽이 오른쪽을 세지 않을까요."

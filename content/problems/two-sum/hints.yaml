# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# 여기 없는 역량은 사다리가 문제 데이터에서 만들어진다 — 목표 복잡도는 catalog.yaml 에,
# "여기서 흔히 무너진다"는 mutants/ 의 설명 줄에 이미 있다. 같은 사실을 두 곳에 쓰지
# 않는다 (HintLadder).
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.


MODELING:
  - "짝을 찾으려고 배열을 두 번 훑고 있다면, 안쪽 훑기가 매번 무엇을 찾고 있는지 말로 해 보세요."
  - "찾고 있는 것은 \"target 에서 지금 값을 뺀 수가 앞에 있었는가\"입니다. 지나온 값을 값→인덱스로 기억해 두면 그 물음이 조회 한 번이 됩니다."

IMPLEMENTATION:
  - "기억해 두는 일과 찾는 일 중 무엇을 먼저 해야 하는지 정해 두세요. 순서가 바뀌면 같은 원소를 두 번 쓰게 됩니다."
  - "한 번 훑으면서 각 원소마다 \"먼저 찾고, 없으면 기억한다\" 순서로 하면 자기 자신과 짝지어지지 않습니다."


# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "'정확히 k' 는 창으로 바로 세기 어렵습니다 — 오른쪽을 늘리면 조건을 벗어났다가 다시 들어옵니다. 'k 개 이하' 는 단조라 창이 됩니다."
  - "정확히 k = (이하 k) − (이하 k−1). 같은 함수를 두 번 부르세요."
ALGORITHM_CHOICE:
  - "이하 k 를 셀 때 오른쪽 끝마다 창 안의 모든 왼쪽 끝이 답입니다 — right − left + 1 을 더하세요."
CORRECTNESS:
  - "왼쪽을 줄일 때 그 값의 개수가 0 이 되면 종류 수를 줄여야 합니다. 안 줄이면 창이 다시 늘지 못합니다."
OPTIMIZATION:
  - "모든 구간의 종류를 세면 n² 입니다. 2 만 개에서 2 억이라 아슬아슬하고, 창 둘이면 2n 입니다."

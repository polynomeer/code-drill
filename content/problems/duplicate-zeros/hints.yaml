# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "앞에서부터 제자리에서 0 을 한 번 더 쓰면, 아직 읽지 않은 원소는 어떻게 되나요?"
  - "몇 번째 원소까지 살아남는지 먼저 세 두면, 뒤에서 앞으로 써서 덮어쓰기를 피할 수 있습니다."
EDGE_CASES:
  - "살아남는 마지막 원소가 0 인데 남은 칸이 하나뿐이면, 그 0 은 몇 번 써야 하나요?"
IMPLEMENTATION:
  - "읽는 자리와 쓰는 자리를 둘 다 뒤에서 시작하세요. 0 을 읽으면 쓰는 자리에 두 번 씁니다."

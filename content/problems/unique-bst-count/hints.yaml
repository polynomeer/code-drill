# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "루트를 r 로 잡으면 왼쪽에는 1..r-1, 오른쪽에는 r+1..n 이 들어갑니다. 왼쪽의 모양 수는 어떤 값이 들어가든 크기 r-1 만으로 정해집니다."
  - "그래서 크기 k 의 답 f(k) 는 루트마다 f(왼쪽 크기) × f(오른쪽 크기) 를 더한 것입니다."
CORRECTNESS:
  - "왼쪽과 오른쪽은 독립적으로 정해지니 더하는 것이 아니라 곱하는 것입니다. 루트가 1 이면 왼쪽은 비어 있고, 빈 트리의 모양은 0 개가 아니라 1 개입니다."
OPTIMIZATION:
  - "f(k) 는 루트마다 f 를 두 번 부르니 기억하지 않으면 지수입니다. 크기는 0..n 뿐이니 배열 하나면 됩니다."
EDGE_CASES:
  - "n = 0 은 빈 트리 하나로 1 입니다. n = 1 도 1 입니다."

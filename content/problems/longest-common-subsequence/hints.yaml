# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "first 의 앞 i 글자와 second 의 앞 j 글자에 대한 답을 표의 한 칸으로 두면, 그 칸은 어느 칸들로 정해집니까."
  - "마지막 글자가 같으면 둘 다 하나씩 뺀 칸에 1 을 더한 것이고, 다르면 한쪽만 뺀 두 칸 중 큰 것입니다. 그리고 한 행을 채우는 데 필요한 것은 바로 앞 행뿐입니다 — 표 전체를 들지 마세요."

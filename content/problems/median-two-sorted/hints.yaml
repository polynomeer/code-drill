# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "중앙값은 전체를 왼쪽 절반과 오른쪽 절반으로 나누는 자리입니다. 두 배열을 각각 어디서 자르면 왼쪽 절반이 되나요 — 한쪽의 자르는 자리를 정하면 다른 쪽은 정해집니다."
  - "왼쪽 절반의 최댓값이 오른쪽 절반의 최솟값보다 크지 않으면 그 자리가 답입니다. 아니면 자르는 자리를 옮깁니다 — 어느 쪽으로요."
CORRECTNESS:
  - "홀수 개면 왼쪽 절반에 하나 더 둡니다. (m+n+1)/2 가 그 수입니다. 짝수 개면 왼쪽 최댓값과 오른쪽 최솟값의 합이 답입니다."
EDGE_CASES:
  - "한 배열이 비어 있거나 통째로 왼쪽에 들어가면 자르는 자리가 0 이거나 끝입니다. 그때 \"왼쪽 최댓값\"과 \"오른쪽 최솟값\"은 무엇으로 두나요."
IMPLEMENTATION:
  - "짧은 배열에서 자르세요. 긴 쪽에서 자르면 다른 쪽의 자리가 음수가 됩니다."

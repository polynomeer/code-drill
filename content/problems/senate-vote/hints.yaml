# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "권리를 빼앗긴 의원은 그 뒤로 영영 차례가 없습니다. 한 바퀴가 끝나면 남은 의원은 같은 순서로 다시 돕니다. 그러면 바퀴는 언제 끝나나요?"
MODELING:
  - "내 차례에 상대 의원 중 누구를 막는 것이 가장 이로울까요? 곧 우리 편을 막으러 올 의원은 누구인가요?"
  - "정당마다 차례를 기다리는 의원의 줄을 두면, 두 줄의 맨 앞 중 먼저 차례가 오는 쪽이 상대의 맨 앞을 막습니다."
CORRECTNESS:
  - "막은 의원은 다음 바퀴의 어디에 서야 하나요? 이번 바퀴에 남은 모든 의원보다 뒤입니다. 번호로 그것을 어떻게 나타낼까요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "k 번째 사람이 '줄을 떠나는' 순간이 답입니다. 처음 표를 사는 순간이 아닙니다."
  - "앞사람은 한 장 사고 뒤로 갑니다. 그래서 k 보다 뒤에 선 사람도 k 가 끝나기 전에 표를 삽니다."
MODELING:
  - "줄을 그대로 흉내 내면 됩니다. 앞에서 꺼내 한 장 사고, 남았으면 뒤에 넣으세요."
  - "흉내 내지 않고 셀 수도 있습니다. k 앞의 사람은 k 가 사는 만큼까지, k 뒤의 사람은 그보다 한 장 덜 삽니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "위아래 두 행을 정해 두면, 그 사이의 열마다 합을 내 한 줄짜리 배열이 됩니다. 그 배열에서는 무엇을 세면 되나요?"
  - "한 줄짜리 배열에서 합이 목표인 구간의 수는, 지금까지의 누적합이 몇 번 나왔는지 기억해 두면 한 번 훑기로 셉니다."
ALGORITHM_CHOICE:
  - "모든 직사각형을 하나씩 재면 몇 개인가요? 행 쌍을 고르는 것과 열 쌍을 고르는 것 중 어느 쪽을 줄여야 하나요?"
EDGE_CASES:
  - "누적합 맵을 비운 채 시작하면 맨 왼쪽 열에서 시작하는 직사각형을 셀 수 있나요? 그리고 위 행과 아래 행이 같은 경우도 세나요?"

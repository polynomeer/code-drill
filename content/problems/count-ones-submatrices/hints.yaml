# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "부분 행렬을 오른쪽 아래 모서리로 센다면, 행 i 까지 내려왔을 때 열마다 무엇을 들고 있으면 되나요?"
  - "오른쪽 아래가 (i, j) 인 부분 행렬의 수는 j 에서 왼쪽으로 가며 지나온 높이들로 어떻게 나타나나요?"
ALGORITHM_CHOICE:
  - "왼쪽에서 처음 만나는 더 낮은 열 p 를 알면, (i, j) 의 개수를 (i, p) 의 개수로부터 어떻게 이어 붙이나요? 그런 p 를 한 번에 찾는 자료구조는 무엇인가요?"
EDGE_CASES:
  - "왼쪽에 더 낮은 열이 없으면 j 까지 열이 몇 개인가요?"
  - "200 × 600 의 1 만 있어도 수는 얼마나 되나요? Int 에 드나요?"
COMPLEXITY:
  - "모서리마다 왼쪽으로 하나씩 늘려 가면 100 × 20 000 에서 몇 걸음인가요?"

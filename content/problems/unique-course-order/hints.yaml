# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "'순서가 여럿'이라는 말은 어느 시점에 둘 중 아무거나 먼저 들어도 된다는 뜻입니다. 그 시점이 언제인지 위상 정렬 안에서 찾아 보세요."
  - "지금 들을 수 있는 과목은 아직 남은 선수 과목이 없는 과목입니다. 그 수를 걸음마다 세어 보세요."
CORRECTNESS:
  - "걸음마다 후보가 하나였다면 그 선택은 강제된 것이고, 강제된 선택만 이어졌다면 순서는 하나뿐입니다."
EDGE_CASES:
  - "순환이 있으면 순서가 아예 없습니다 — 처리한 과목 수가 n 인지 마지막에 확인하세요. 과목이 하나면 답은 1 입니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "규칙을 조각 하나에 대한 말로 바꿔 보세요. 빈 조각, 점 하나, 점 둘, 그리고 나머지 — 넷이면 전부입니다."
  - "점 셋은 어느 갈래인가요? 지문은 점 둘만 위 폴더라고 말합니다."
IMPLEMENTATION:
  - "지금 어느 폴더에 있는지를 들어간 순서대로 쌓아 두면, 위로 올라가는 것은 맨 위 하나를 버리는 일입니다."
  - "다 보고 나면 쌓인 것을 바닥부터 빗금으로 이으면 됩니다. 앞에 빗금 하나를 붙이는 것을 잊지 마세요."
EDGE_CASES:
  - "루트에서 위로 올라가라는 조각을 만나면 무엇을 해야 하나요? 꺼낼 것이 없습니다."
  - "모든 폴더에서 다 나왔을 때 답이 무엇인지 따로 확인해 보세요."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "답의 첫 글자를 될 수 있는 한 작게 하고 싶습니다. 지금 답 끝에 있는 큰 글자를 빼고 작은 글자를 앞세워도 되는 때는 언제인가요?"
  - "왼쪽부터 답을 쌓아 가며 끝 글자를 빼기도 한다면, 어떤 자료구조가 맞나요?"
CORRECTNESS:
  - "끝 글자를 뺐는데 그 글자가 뒤에 다시 나오지 않으면 어떻게 되나요? 각 글자가 마지막으로 나오는 위치를 알고 있나요?"
EDGE_CASES:
  - "이미 답에 든 글자가 다시 나오면 어떻게 하나요? 그 글자로 앞의 글자를 빼도 되나요?"

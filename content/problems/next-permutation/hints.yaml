# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "뒤에서부터 보면 어디까지가 내림차순인가요. 그 부분은 이미 그 원소들로 만들 수 있는 가장 큰 배열이라 더 키울 수 없습니다."
  - "그 바로 앞의 자리 i 를 조금만 키워야 합니다 — 뒤에서 a[i] 보다 큰 것 중 가장 작은 원소와 바꾸고, 뒤를 가장 작게(오름차순) 만드세요."
CORRECTNESS:
  - "뒤가 내림차순이니 '큰 것 중 가장 작은' 원소는 뒤에서부터 처음으로 a[i] 보다 큰 원소입니다. 바꾼 뒤에도 뒤는 내림차순이라 뒤집기만 하면 오름차순입니다."
EDGE_CASES:
  - "중복이 있으면 등호가 답을 가릅니다. 꺾이는 자리는 a[i] < a[i+1] 이어야 하고(같으면 계속 내려간다), 바꿀 상대는 a[j] > a[i] 여야 합니다."
  - "전부 내림차순이면 마지막이라 처음(오름차순)으로 돌아갑니다 — 전체를 뒤집으세요."
IMPLEMENTATION:
  - "뒤집기는 양 끝에서 두 포인터로 바꾸며 만납니다. 정렬을 부를 필요가 없습니다."

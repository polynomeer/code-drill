# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "0 부터 n 까지 전부와 배열의 원소 전부를 같이 놓으면, 빠진 수만 한 번 나오고 나머지는 두 번 나옵니다. 두 번 나오는 것을 없애는 연산을 이미 압니다."
  - "합으로도 됩니다 — 0..n 의 합에서 배열의 합을 뺀 것. 다만 그 합이 얼마나 큰지 보세요."
EDGE_CASES:
  - "빠진 수가 n 자신일 수 있습니다. 배열이 0..n-1 이면 답은 n 입니다. 0..n-1 만 보면 놓칩니다."
CONSTRAINTS:
  - "n 이 20 만이면 0..n 의 합은 200억입니다. Int 는 21억까지입니다."

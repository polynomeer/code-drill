# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "값이 x 인 두 정점 사이의 경로가 좋은 경로이려면, x 보다 큰 정점을 하나도 지나면 안 됩니다. x 이하의 정점만 남긴 숲에서 두 정점은 어떤 관계인가요?"
  - "값이 작은 정점부터 차례로 숲에 더해 간다고 해 보세요. 값 x 의 정점을 더한 직후 같은 무리에 든 값 x 의 정점들 사이는 모두 좋은 경로입니다."
ALGORITHM_CHOICE:
  - "정점마다 트리를 다 훑으면 정점 수의 제곱입니다. 정점을 더하기만 하면서 무리를 관리하는 자료구조는 무엇인가요?"
CORRECTNESS:
  - "값 x 의 정점들을 언제 세야 하나요? 하나를 이을 때마다 세면 나중에 같은 무리로 합쳐지는 쌍을 놓칩니다."
EDGE_CASES:
  - "정점 하나도 좋은 경로입니다. 한 무리에 같은 값의 정점이 c 개면 좋은 경로는 몇 개인가요?"

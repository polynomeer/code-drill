# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

READING:
  - "반환할 배열의 길이를 먼저 정해 보세요. 0 도 세는 수에 들어갑니다."
  - "n 이 5 이면 답의 길이는 6 입니다. 0 의 1 비트 수는 0 입니다."

IMPLEMENTATION:
  - "6 의 이진수 110 과 3 의 이진수 11 을 나란히 놓고 보세요. 하나를 오른쪽으로 한 칸 밀면 다른 쪽이 됩니다."
  - "어떤 수의 1 비트 수는 그 수를 반으로 나눈 수의 1 비트 수에 마지막 자리를 더한 것입니다. 작은 수부터 채우면 매번 앞의 답을 씁니다."

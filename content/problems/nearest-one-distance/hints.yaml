# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "'가장 가까운 1' 을 찾는 대신 '1 에서 퍼져 나간다' 로 뒤집어 보세요. 누가 먼저 닿는지가 곧 답입니다."
  - "시작점이 여럿인 너비 우선 탐색입니다. 시작할 때 큐에 무엇을 넣어야 할지 생각해 보세요."
ALGORITHM_CHOICE:
  - "1 마다 따로 퍼뜨리면 1 의 수 × 칸 수입니다. 한 번에 퍼뜨리면 칸 수입니다."
EDGE_CASES:
  - "1 이 하나뿐인 격자, 전부 1 인 격자, 1 이 맨 끝에만 있는 격자를 그려 보세요. 대각선은 한 걸음이 아닙니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "구간 안의 어느 두 수도 AND 가 0 이라는 것은 비트로 말하면 무엇인가요? 구간 전체의 OR 과 새 수 하나만 보고 넣을 수 있는지 알 수 있나요?"
CORRECTNESS:
  - "새 수가 창 안의 수 여럿과 겹치면, 왼쪽에서 몇 개를 빼야 하나요?"
  - "창에서 수를 뺄 때 OR 에서 그 비트를 어떻게 지우나요? 비트가 겹치지 않는다는 사실이 무엇을 허락하나요?"
EDGE_CASES:
  - "1, 2, 1 은 이웃끼리는 겹치지 않습니다. 셋 모두 한 구간에 둘 수 있나요?"

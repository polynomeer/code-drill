# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "한 사람이 나간 직후의 원을 보세요. 남은 n-1 명은 어디서부터 다시 세기 시작합니까. 그 원은 처음 원과 무엇이 다릅니까."
  - "나간 사람 다음이 새 1 번인 n-1 명의 원입니다. n-1 명일 때의 답을 안다면, n 명일 때의 답은 그 자리를 k 만큼 뒤로 돌린 것입니다 — 0 부터 세면 (답 + k) mod n 입니다."

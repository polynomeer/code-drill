# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "이웃한 두 덩어리를 묶을 때 비용은 무엇이고, 묶인 덩어리는 어떤 값으로 남나요? 작은 잎은 한 번 묶이면 어떻게 되나요?"
ALGORITHM_CHOICE:
  - "작은 잎은 두 이웃 가운데 어느 쪽과 묶는 것이 싼가요? 어떤 잎의 왼쪽과 오른쪽에서 처음 만나는 더 큰 잎을 한 번에 찾는 자료구조는 무엇인가요?"
EDGE_CASES:
  - "잎이 내림차순이면 훑는 동안 아무것도 묶이지 않습니다. 끝에 스택에 남은 잎들은 어떻게 하나요?"
COMPLEXITY:
  - "가장 작은 잎을 찾아 묶기를 되풀이하면 잎 10 만 개에서 몇 걸음인가요? 구간 DP 는요?"

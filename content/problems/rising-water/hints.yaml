# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "어떤 길로 갈 때 몇 시에 닿는지 말로 해 보세요. 그 길이 지나는 칸들 중 가장 높은 칸이 잠기는 시각입니다."
  - "그러니 답은 '지나는 칸의 최댓값'이 가장 작은 길의 그 최댓값입니다. 합이 아닙니다."
ALGORITHM_CHOICE:
  - "시각 t 가 정해지면 닿을 수 있는지는 t 이하인 칸만 밟는 탐색 한 번으로 압니다. t 가 클수록 쉬워지고 작을수록 어려워집니다."
  - "그런 성질이 있으면 t 를 이분 탐색할 수 있습니다. 또는 '지금까지의 최댓값이 가장 작은 칸'을 먼저 확정하는 힙도 됩니다."

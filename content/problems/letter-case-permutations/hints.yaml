# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "결과는 어떤 순서로 정렬하나요? 문자 코드에서 'A' 와 'a' 중 어느 것이 앞인가요?"
IMPLEMENTATION:
  - "글자를 하나씩 정해 나간다면, 영문자에서는 몇 갈래, 숫자에서는 몇 갈래로 내려가나요? 갈래를 어떤 순서로 내려가면 정렬이 저절로 되나요?"
EDGE_CASES:
  - "숫자도 대문자·소문자 두 갈래로 내려가면 무슨 일이 생기나요?"
  - "원래 문자열도 결과에 드나요?"

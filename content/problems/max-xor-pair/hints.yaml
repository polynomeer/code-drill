# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "XOR 의 최댓값은 높은 비트에서 결정됩니다. 어떤 쌍이 비트 29 에서 다르면 그 아래 비트가 어떻든 그 쌍이 이깁니다."
  - "그러니 답을 높은 비트부터 한 자리씩 정하세요: '지금까지의 답에 이 비트를 1 로 더한 값이 어떤 쌍으로 가능한가'."
ALGORITHM_CHOICE:
  - "가능한지는 모든 수의 상위 비트 접두사를 집합에 모으고, 후보 xor 접두사 가 집합에 있는지로 압니다 — a xor b = c 이면 a = b xor c 이기 때문입니다."
  - "비트마다 접두사 집합을 새로 만드세요. 마스크가 바뀌면 접두사도 바뀝니다."
OPTIMIZATION:
  - "모든 쌍은 30 만 개에서 450 억 쌍입니다. 비트 30 개 × n 이면 900 만입니다."
CONSTRAINTS:
  - "값이 2³⁰ 미만이니 비트 29 부터 봅니다. 28 부터 보면 최상위에서 갈리는 쌍의 답이 절반이 됩니다."

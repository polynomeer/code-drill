# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "가장 싼 선택에서 a 의 길과 b 의 길은 어디서 만나나요? 만난 뒤에도 갈라질 이유가 있나요?"
  - "두 길이 정점 v 에서 만난다면 비용은 어떤 세 거리의 합인가요?"
ALGORITHM_CHOICE:
  - "모든 v 에서 dest 까지의 거리를 한 번에 구하려면, 어느 그래프에서 어디로부터 다익스트라를 돌리면 되나요?"
CORRECTNESS:
  - "a → dest 와 b → dest 의 최단 거리를 따로 더하면, 두 길이 함께 쓰는 간선은 몇 번 세어지나요?"
EDGE_CASES:
  - "어떤 v 에서도 세 거리가 모두 있지 않으면 무엇을 반환하나요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "질의는 '값 v 가 나오는 자리 중 l 이상 r 이하인 것의 수'입니다. 값마다 나오는 자리를 모아 두면 그 목록은 이미 정렬돼 있습니다."
ALGORITHM_CHOICE:
  - "정렬된 자리 목록에서 l 이상인 첫 자리와 r 초과인 첫 자리를 찾으면, 둘의 차가 답입니다."
  - "둘 다 같은 '이상인 첫 자리' 탐색으로 씁니다 — 두 번째는 r+1 을 넣으면 됩니다."
OPTIMIZATION:
  - "질의마다 구간을 훑으면 10만 질의 × 10만 길이입니다. 전처리 한 번에 질의를 로그로 만드세요."
EDGE_CASES:
  - "없는 값은 0 이고, 있는 값이 구간 밖에만 있어도 0 입니다. 양 끝은 포함입니다 — l = r 인 질의로 확인해 보세요."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "배열을 반으로 나누면 쌍은 세 종류입니다. 둘 다 왼쪽, 둘 다 오른쪽, 하나씩. 앞의 둘은 같은 문제이고, 마지막 하나만 새로 세면 됩니다."
  - "왼쪽 반과 오른쪽 반이 각각 정렬돼 있다면, 왼쪽 값이 커질수록 조건을 만족하는 오른쪽 값의 범위는 어떻게 변하나요?"
ALGORITHM_CHOICE:
  - "세는 일과 합치는 일을 한 번에 하려고 하면 비교 기준이 서로 달라 꼬입니다. 따로 한 번씩 훑어도 복잡도는 같습니다."
EDGE_CASES:
  - "nums[j] 가 Int 의 절반을 넘으면 그 두 배는 어떻게 되나요? 음수일 때는요?"

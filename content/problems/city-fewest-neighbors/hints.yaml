# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "이웃의 정의는 도로 하나로 닿는 도시가 아니라 최단 거리가 문턱 이하인 도시입니다. 문턱과 같은 거리는 어느 쪽인가요?"
  - "이웃 수가 같은 도시가 여럿이면 어느 것을 고르라고 하나요?"
ALGORITHM_CHOICE:
  - "모든 도시 쌍의 최단 거리가 필요합니다. 도시가 100 개뿐이라면 세제곱도 충분히 빠릅니다."
CORRECTNESS:
  - "세 겹 반복에서 거쳐 가는 도시는 어느 겹이어야 하나요? 그것이 가장 바깥에 있어야 하는 이유를 말로 해 보세요."

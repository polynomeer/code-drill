# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "(최댓값 − 최솟값)의 합은 어떤 두 합의 차로 나눌 수 있나요?"
  - "원소 i 가 최댓값인 구간은 몇 개인가요? 왼쪽과 오른쪽으로 얼마나 뻗을 수 있는지로 말해 보세요."
CORRECTNESS:
  - "같은 값이 여럿인 구간에서 최댓값을 맡는 원소는 몇 개여야 하나요? 등호를 어느 쪽에 두나요?"
EDGE_CASES:
  - "값이 음수일 때 나머지는 어떻게 되나요? 원소 × 구간 수는 Long 에 드나요?"
COMPLEXITY:
  - "시작마다 끝을 늘려 가면 10 만 원소에서 몇 구간인가요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "1차원에서 한 칸의 수위는 양쪽 최대 중 작은 것이었습니다. 2차원에서는 그 칸에서 밖으로 나가는 모든 길 중, 길에서 만나는 가장 높은 칸이 가장 낮은 길 — 그 높이가 수위입니다."
  - "안쪽에서 밖으로 계산하기는 어렵고, 밖에서 안으로 채우기는 쉽습니다. 가장자리에서 시작해 가장 낮은 칸부터 안으로 들어가 보세요."
ALGORITHM_CHOICE:
  - "가장자리 칸을 전부 최소 힙에 넣고, 가장 낮은 칸을 꺼내 이웃을 봅니다. 이웃이 지금 수위보다 낮으면 그 차이가 고이는 물이고, 이웃은 max(수위, 이웃 높이) 로 힙에 들어갑니다."
CORRECTNESS:
  - "이웃을 자기 높이로 넣으면 안 됩니다 — 낮은 이웃의 수위는 그 이웃 높이가 아니라 지금까지의 고개 높이입니다. 보통 큐로 바깥부터 훑는 것도 안 됩니다: 가장 낮은 고개부터 봐야 수위가 맞습니다."
OPTIMIZATION:
  - "칸마다 밖으로 나가는 가장 낮은 고개를 따로 찾으면 (RC)² 입니다. 밖에서 안으로 한 번 채우면 칸이 힙에 한 번씩만 들어갑니다."
COMPLEXITY:
  - "칸 하나가 힙에 한 번 — O(RC log RC) 입니다."

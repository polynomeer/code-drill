# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "윤곽선은 '높이가 바뀌는 자리' 의 목록입니다. 건물이 아니라 그 목록을 다루는 연산이 무엇인지 먼저 정하세요."
  - "윤곽선 둘을 합치는 일은 정렬된 두 목록을 나란히 훑는 일입니다. 각 시점에 필요한 것은 양쪽의 '현재 높이' 둘입니다."
ALGORITHM_CHOICE:
  - "합칠 수 있으면 나눌 수 있습니다. 건물 하나의 윤곽선은 점 두 개입니다."
EDGE_CASES:
  - "같은 x 에서 양쪽이 동시에 바뀌는 경우, 같은 높이가 이어지는 경우, 한 건물이 다른 건물을 완전히 덮는 경우를 각각 그려 보세요."
IMPLEMENTATION:
  - "점을 넣기 전에 직전 높이와 같은지 한 곳에서만 확인하면, 합치기의 세 갈래(왼쪽·오른쪽·동시)가 모두 그 검사를 거칩니다."

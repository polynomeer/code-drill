# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "괄호의 짝을 맞추는 스택은 압니다. 여기서는 짝이 맞았는지가 아니라 \"여기서 끝나는 올바른 구간이 얼마나 긴가\"를 묻습니다. 스택에 무엇을 넣어야 길이를 잴 수 있나요."
  - "인덱스를 넣으세요. 닫는 괄호에서 하나 꺼낸 뒤 스택 꼭대기가 구간의 왼쪽 경계입니다."
CORRECTNESS:
  - "스택이 비면 지금 자리가 다음 구간의 왼쪽 경계입니다. 처음에는 -1 을 넣어 두세요 — 문자열 시작에서 끝나는 구간을 재려면요."
COMPLEXITY:
  - "시작점마다 균형을 세면 n² 입니다. 스택이면 각 괄호가 한 번 들어가고 한 번 나옵니다."
EDGE_CASES:
  - "()(()) 는 6 입니다 — 두 구간이 이어집니다. )))()() 는 4 입니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "가운데를 보면 왼쪽 반과 오른쪽 반 중 적어도 하나는 정렬돼 있습니다. 어느 쪽인지 무엇으로 알 수 있나요?"
  - "정렬된 쪽이라면 찾는 값이 그 범위 안에 있는지 양 끝과 견줘 바로 압니다. 아니면 다른 쪽으로 갑니다."
EDGE_CASES:
  - "구간에 원소가 하나나 둘만 남았을 때 왼쪽 끝과 가운데가 같은 자리일 수 있습니다. 그때 왼쪽은 정렬된 것인가요?"
CORRECTNESS:
  - "없는 값을 물으면 무엇을 돌려줘야 하나요? 탐색이 끝난 자리가 아닙니다."

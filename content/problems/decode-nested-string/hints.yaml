# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "여는 괄호를 만나면 지금까지 모은 숫자와 문자열을 미뤄 두고 새로 시작합니다. 닫는 괄호에서 미뤄 둔 것을 꺼내 '이전 문자열 + 지금 문자열 × 숫자' 로 잇습니다. 스택 둘입니다."
IMPLEMENTATION:
  - "숫자는 여러 자리일 수 있습니다 — 자릿수를 쌓아 가세요. 여는 괄호에서 숫자를 0 으로 되돌려야 다음 숫자가 앞 숫자에 붙지 않습니다."
EDGE_CASES:
  - "괄호 앞의 글자(ab2[cd])가 사라지지 않는지, 형제 괄호(2[a]2[b])가 각각 반복되는지, 세 겹 중첩을 확인하세요."

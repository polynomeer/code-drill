# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "가장 큰 직사각형의 아랫변은 어느 한 행에 닿아 있습니다. 그 행에서 각 열이 위로 몇 칸 이어져 있는지를 적으면 무엇이 됩니까."
  - "행마다 히스토그램이 됩니다. 히스토그램에서 가장 큰 직사각형을 찾는 법은 이미 아는 문제이고, 행마다 그것을 한 번씩 하면 답은 그 최댓값입니다."

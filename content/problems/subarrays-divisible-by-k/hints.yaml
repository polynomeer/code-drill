# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "구간 합은 누적 합 두 개의 차입니다. 차가 k 의 배수라는 조건을 두 누적 합 각각의 성질로 바꿔 보세요."
  - "차가 k 의 배수라는 것은 k 로 나눈 나머지가 같다는 뜻입니다. 나머지마다 지금까지 몇 번 나왔는지 세면, 새 누적 합의 나머지와 같은 것의 개수가 곧 그 자리에서 끝나는 부분배열의 수입니다. 빈 접두사의 나머지 0 도 하나로 세어 두세요."

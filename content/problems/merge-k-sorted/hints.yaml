# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

ALGORITHM_CHOICE:
  - "두 목록 합치기는 압니다. k 개면 어떻게 하나요 — 하나씩 차례로 합치면 앞의 결과를 매번 다시 훑습니다."
  - "매 순간 필요한 것은 \"남은 것 중 가장 작은 값\"이고, 후보는 목록마다 앞 원소 하나뿐입니다. k 개 중 최솟값을 빠르게 꺼내는 구조가 있습니다."
IMPLEMENTATION:
  - "힙에는 값만이 아니라 어느 목록의 몇 번째인지도 넣으세요. 꺼낸 뒤 그 목록의 다음 원소를 넣어야 합니다."
  - "빈 목록은 처음부터 넣지 않습니다. 다음 원소를 넣을 때는 그 목록의 끝을 넘지 않는지 보세요 — 넘으면 다른 목록의 원소가 섞여 들어옵니다."
COMPLEXITY:
  - "원소 하나가 힙에 들어갔다 나오는 데 log k 입니다. 전체 N log k. 하나씩 합치면 N × k 이고, 목록이 20만 개면 얼마입니까."
EDGE_CASES:
  - "목록이 하나도 없거나 전부 비어 있으면 빈 배열입니다. 같은 값은 각각 남깁니다."

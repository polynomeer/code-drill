# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "다른 낱말 안에 든 낱말은 따로 담을 필요가 있나요? 그런 낱말을 먼저 걷어내면 남은 문제는 무엇이 되나요?"
  - "남은 낱말끼리는 이어 붙이는 순서만 정하면 됩니다. 앞 낱말의 끝과 다음 낱말의 앞이 겹치는 만큼 짧아집니다."
  - "다음에 무엇을 붙일지는 지금까지 쓴 낱말이 무엇인지와 마지막 낱말이 무엇인지만 알면 정해집니다."
ALGORITHM_CHOICE:
  - "가장 많이 겹치는 짝부터 잇는 방법은 빠르지만 언제나 가장 짧지는 않습니다. 반례를 직접 찾아보세요."
  - "순서를 모두 해 보면 낱말이 열여섯일 때 20조 가지입니다. 쓴 낱말의 집합을 비트로 적으면 표가 몇 칸인가요?"
EDGE_CASES:
  - "같은 낱말이 두 번 나오면 서로가 서로 안에 들어 있습니다. 둘 다 걷어내면 무엇이 남나요?"

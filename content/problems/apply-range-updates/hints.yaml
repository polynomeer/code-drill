# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "'l..r 에 v 를 더한다'를 '차이 배열의 l 에 +v, r+1 에 −v' 로 바꾸세요. 차이 배열의 누적합이 원래 배열입니다."
EDGE_CASES:
  - "r 이 마지막 자리면 r+1 은 배열 밖입니다 — 차이 배열은 한 칸 길어야 합니다. 갱신이 하나도 없으면 0 배열입니다."
OPTIMIZATION:
  - "갱신마다 구간을 훑으면 10 만 × 10 만입니다. 갱신 하나가 두 칸이면 전체가 갱신 수 + n 입니다."

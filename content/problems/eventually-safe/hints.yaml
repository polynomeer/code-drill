# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "어떤 정점이 안전하지 않은 이유를 말로 해 보세요. 그 정점에서 출발해 순환에 닿을 수 있다는 것입니다."
  - "거꾸로 생각하면 쉽습니다. 끝 정점은 안전하고, 나가는 간선이 전부 안전한 정점으로만 가는 정점도 안전합니다. 이 정의로 안전한 정점을 하나씩 늘려 가세요."
IMPLEMENTATION:
  - "간선을 뒤집어 두면 '안전해진 정점에서 그리로 가던 정점들'을 찾을 수 있습니다. 정점마다 아직 안전하지 않은 곳으로 나가는 간선 수를 세어 두세요."
  - "그 수가 0 이 되는 순간 그 정점은 안전합니다. 큐로 퍼져 나가면 한 번에 끝납니다."

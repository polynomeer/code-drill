# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "구간의 합을 누적합의 차로 써 보세요. 그러면 문제는 i < j 이고 P[j] - P[i] 가 범위 안인 쌍의 수가 됩니다."
  - "쌍을 세는 문제에서 배열을 절반으로 나누면, 양쪽 안의 쌍은 재귀가 세고 양쪽에 걸친 쌍만 여기서 세면 됩니다. 역전 쌍 세기와 같은 뼈대입니다."
ALGORITHM_CHOICE:
  - "양쪽이 각각 정렬돼 있으면 왼쪽의 P[i] 하나에 대해 범위에 드는 오른쪽 P[j] 는 연속한 구간입니다. 그 구간의 양 끝은 i 가 커질수록 오른쪽으로만 움직입니다."
  - "그래서 절반마다 두 포인터로 셀 수 있고, 세고 나서 양쪽을 병합해 정렬해 두면 위 단계가 같은 성질을 씁니다."

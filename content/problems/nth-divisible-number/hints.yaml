# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "x 이하에서 a 의 배수는 몇 개인가요? a 의 배수이면서 b 의 배수인 수는 어떤 수의 배수인가요?"
  - "x 이하의 개수를 바로 셀 수 있다면, 그 개수가 처음 n 이 되는 x 는 어떻게 찾나요?"
ALGORITHM_CHOICE:
  - "개수는 x 가 커질수록 줄지 않습니다. 답을 직접 찾는 대신 답을 추측하고 확인한다면, 어떤 탐색이 맞나요?"
COMPLEXITY:
  - "답이 20 억이면 하나씩 세어 올라가는 데 몇 걸음이 드나요? n 번 앞으로 가는 병합은요?"
EDGE_CASES:
  - "세 수의 최소공배수는 얼마나 커질 수 있나요? Long 에 드나요? 답보다 큰 최소공배수의 몫은 언제나 얼마인가요?"
  - "개수가 정확히 n 인 x 는 여럿입니다. 그중 무엇이 답인가요?"

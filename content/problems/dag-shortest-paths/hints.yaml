# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

ALGORITHM_CHOICE:
  - "간선 무게가 음수일 수 있습니다. 다익스트라가 한 번 확정한 정점은 나중에 더 짧아지지 않는다는 가정이 여기서도 맞나요?"
  - "순환이 없다는 조건은 무엇을 보장하나요? 어떤 순서로 정점을 처리하면, 정점을 꺼낼 때 그리로 들어오는 간선이 모두 끝나 있나요?"

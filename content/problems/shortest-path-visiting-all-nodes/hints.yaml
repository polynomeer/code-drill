# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "정점을 다시 지나도 되니 '어디를 지났는가'가 아니라 '어떤 정점들을 방문했는가'가 상태입니다. 거기에 '지금 어디 서 있는가'를 더하면 상태가 정해집니다."
  - "간선 하나가 비용 1 이니 그 상태 그래프 위의 BFS 가 답입니다."
ALGORITHM_CHOICE:
  - "시작점은 아무 데나입니다 — 모든 정점을 방문 집합 {자기 자신} 으로 큐에 한꺼번에 넣고 시작하세요."
  - "집합이 가득 차는 첫 순간의 거리가 답입니다. 같은 (집합, 정점)은 한 번만 넣습니다."
CORRECTNESS:
  - "집합만 상태로 두면 어디 서 있는지를 잊어, 이어질 수 없는 두 걸음을 잇게 됩니다. 정점을 다시 못 지나게 하면 별 모양에서 답이 없습니다."
CONSTRAINTS:
  - "n ≤ 12 는 2^n · n ≈ 5 만 상태를 허락하는 크기입니다. n! 은 4 억이라 순열을 세는 것은 안 됩니다."
COMPLEXITY:
  - "상태 2^n · n 개, 상태마다 이웃 수만큼 — O(2^n · n · deg) 입니다."

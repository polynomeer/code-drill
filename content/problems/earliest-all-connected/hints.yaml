# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "기록이 시각 순서대로 오지 않는다는 문장을 다시 보세요. 주어진 순서대로 반영하면 무엇이 잘못됩니까?"
  - "답은 '모두가 이어지는 가장 이른 시각'입니다. 시각순으로 반영해 무리가 하나가 되는 순간을 찾으면 됩니다."
IMPLEMENTATION:
  - "무리의 수를 n 에서 시작해, 서로 다른 무리를 실제로 합칠 때만 하나 줄이세요. 이미 같은 무리인 둘의 기록은 아무것도 바꾸지 않습니다."
  - "두 사람이 같은 무리인지 빨리 답하는 구조가 유니온파인드입니다. 매번 그래프를 훑어 세지 마세요."

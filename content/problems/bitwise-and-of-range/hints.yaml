# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "어떤 비트 자리가 구간 안에서 한 번이라도 0 이면 결과의 그 자리는 0 입니다. 연속한 정수는 낮은 자리부터 뒤집히니, left 와 right 가 갈리는 자리 아래는 전부 0 이 됩니다."
  - "남는 것은 두 수의 공통 이진 접두사입니다. 같아질 때까지 둘을 오른쪽으로 밀고, 민 만큼 되돌리세요."
CONSTRAINTS:
  - "구간이 20 억 개일 수 있습니다. 하나씩 AND 하는 것은 안 되고, 비트 수만큼만 돌아야 합니다."
CORRECTNESS:
  - "밀고 나서 되돌리는 것을 잊으면 접두사만 남습니다. 양 끝만 AND 하면 사이의 수가 끈 비트를 못 봅니다 — 5 와 7 사이의 6 은 1 번 비트가 0 입니다."

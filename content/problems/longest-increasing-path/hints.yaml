# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "작은 칸에서 이웃한 큰 칸으로 간선을 그리면 이 그래프에 순환이 있을 수 있나요? 값이 엄격히 커진다는 조건을 떠올려 보세요."
  - "순환이 없는 그래프의 가장 긴 경로는 위상 순서로 구합니다. 더 작은 이웃이 없는 칸들이 첫 층이라면, 다음 층은 무엇인가요?"
ALGORITHM_CHOICE:
  - "칸마다 오르막 경로를 모두 따라가면 경로의 가짓수만큼 걸립니다. 한 칸에서 시작하는 가장 긴 경로는 한 번만 구하면 됩니다."
EDGE_CASES:
  - "한 줄로 16 만 칸이 늘어서 오른쪽으로만 커지는 격자에서, 재귀로 따라가면 깊이가 얼마나 되나요?"

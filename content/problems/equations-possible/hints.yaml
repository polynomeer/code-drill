# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "등식은 무엇을 뜻하나요. a==b 이고 b==c 이면 a 와 c 는요. \"같다\"는 관계가 전이됩니다 — 같은 묶음입니다."
  - "부등식은 \"두 글자가 다른 묶음이어야 한다\"입니다. 그러면 모순은 언제 생기나요."
ALGORITHM_CHOICE:
  - "묶음을 합치고 같은 묶음인지 묻는 구조를 이미 썼습니다 — 중복 간선 찾기에서요."
CORRECTNESS:
  - "식을 순서대로 처리하면 03 번 경계 사례에서 무엇이 잘못되나요. 부등식이 먼저 오고 등식이 나중에 옵니다."
  - "등식을 전부 먼저 합친 뒤에 부등식을 보세요. 두 번 훑는 것입니다."
EDGE_CASES:
  - "a!=a 는 항상 모순입니다. a==a 는 아무것도 아닙니다."

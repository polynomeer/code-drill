# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "정렬돼 있으니 '이 값이 아직 두 번 미만 나왔다'는 것은 '쓴 자리의 두 칸 앞과 다르다'는 것과 같습니다. 두 칸 앞과 비교하며 당겨 쓰세요."
CORRECTNESS:
  - "비교 상대는 원본이 아니라 지금까지 쓴 자리입니다. 원본의 두 칸 앞은 이미 지운 값일 수 있습니다."
EDGE_CASES:
  - "처음 두 원소는 무조건 씁니다. 한 번씩 나오는 값, 정확히 두 번 나오는 값, 열 번 나오는 값을 섞어 확인하세요."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "채우기 전에 '어느 행과 어느 열을 지울지'를 먼저 다 정해야 합니다. 그 목록을 어디에 둘지 생각해 보세요."
  - "지울 행과 열을 담을 자리는 격자 안에도 있습니다 — 어차피 0 이 될 자리라면 표시로 써도 잃을 것이 없습니다."
IMPLEMENTATION:
  - "표시판으로 쓴 줄은 자기 자신에 대한 정보를 잃습니다. 덮어쓰기 전에 따로 기억해 두고 맨 마지막에 처리하세요."
EDGE_CASES:
  - "첫 행에만 0 이 있을 때, 첫 열에만 있을 때, 모서리에 있을 때를 각각 그려 보세요. 직사각형과 한 칸짜리도 함께."

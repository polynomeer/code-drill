# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "첫 글자가 맞는 칸에서 시작해 다음 글자를 이웃에서 찾는 것을 되풀이합니다. 어디까지 왔는지가 상태입니다 — 칸과 단어의 자리."
CORRECTNESS:
  - "한 갈래가 실패하면 그 갈래가 밟은 칸의 표시를 되돌려야 합니다. 06 번 경계 사례에서 되돌리지 않으면 어떻게 되나요."
  - "같은 칸을 두 번 쓰면 안 됩니다. 05 번 경계 사례는 그래야만 만들어지는 단어입니다."
IMPLEMENTATION:
  - "표시는 뻗기 전에 켜고 돌아올 때 끕니다 — 성공해서 돌아올 때도, 실패해서 돌아올 때도."
OPTIMIZATION:
  - "글자가 어긋나는지를 이웃을 다 뻗은 뒤에 보면 어긋난 갈래를 끝까지 따라갑니다. 들어가자마자 보세요. 단어가 칸 수보다 길면 시작할 필요도 없습니다."

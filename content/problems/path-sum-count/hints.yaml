# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "루트에서 정점까지의 누적합을 P 라 하면, 조상 a 에서 v 까지의 경로 합은 P[v] - P[a] 입니다. 배열의 '합이 k 인 구간 세기'와 같은 모양입니다."
  - "v 에서 끝나는 답은 조상 중 P[a] = P[v] - target 인 것의 수입니다. DFS 로 내려가며 조상들의 누적합을 해시맵에 세세요."
CORRECTNESS:
  - "가지에서 되돌아올 때 그 정점의 누적합을 해시맵에서 빼야 합니다. 안 빼면 다른 가지의 정점이 조상으로 세어집니다."

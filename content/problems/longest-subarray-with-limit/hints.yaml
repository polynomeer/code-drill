# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "조건은 단조입니다 — 구간이 조건을 만족하면 그 안의 모든 구간도 만족합니다. 그래서 오른쪽을 늘리고 안 되면 왼쪽을 줄이는 창이 됩니다."
  - "창의 최댓값과 최솟값이 필요합니다. 창의 최댓값을 상각 O(1) 에 주는 구조를 이미 아시죠 — 최솟값도 같은 구조를 하나 더 두면 됩니다."
ALGORITHM_CHOICE:
  - "최댓값의 단조 감소 덱과 최솟값의 단조 증가 덱. 각 덱의 앞이 창의 최댓값·최솟값이고, 왼쪽을 줄여 앞이 창 밖으로 나가면 뺍니다."
CORRECTNESS:
  - "창은 줄어들지 않습니다 — 왼쪽을 줄이는 것은 차가 한도를 넘는 동안뿐이고, 한 칸씩만 줄입니다. 새 원소를 넣은 뒤에 검사해야 그 원소가 깬 창을 세지 않습니다."
OPTIMIZATION:
  - "구간마다 최댓값·최솟값을 다시 훑으면 n² 입니다. 덱은 원소를 한 번 넣고 한 번 빼니 O(n) 입니다."

# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

READING:
  - "정렬돼 있다는 것이 무엇을 보장하나요. 같은 값은 어디에 있나요."
  - "순서를 유지해야 합니다. 집합에 넣었다 꺼내면 순서가 어떻게 되나요."
IMPLEMENTATION:
  - "바로 앞에 남긴 값과 다를 때만 남기세요. 첫 값은 비교 상대가 없으니 항상 남깁니다."
  - "쓰는 자리와 읽는 자리를 따로 두면 새 배열 없이 됩니다. 쓰는 자리는 남길 때만 한 칸 갑니다."
EDGE_CASES:
  - "빈 배열, 원소 하나, 전부 같은 값, 중복이 맨 끝에만 있는 경우를 손으로 돌려 보세요. 마지막 원소가 빠지지 않나요."

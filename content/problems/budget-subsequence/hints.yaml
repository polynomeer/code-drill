# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "원소를 가장 많이 고르려면 어떤 원소부터 골라야 하나요? 순서가 상관없다는 것은 무엇을 허락하나요?"
ALGORITHM_CHOICE:
  - "정렬한 뒤의 누적합은 늘기만 합니다. 예산 이하인 마지막 누적합을 찾는 데 처음부터 더해 갈 필요가 있나요?"
COMPLEXITY:
  - "예산이 20 만 개이고 저마다 원소 20 만 개를 다 고를 만큼 크면, 예산마다 더해 가는 풀이는 몇 걸음인가요?"
EDGE_CASES:
  - "예산이 누적합과 딱 같으면 그 원소까지 고를 수 있나요?"
  - "누적합은 얼마까지 커지나요? Int 에 드나요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "거리의 제곱만 비교하면 됩니다. 제곱근은 필요 없고, 좌표 차의 제곱은 Int 안이지만 합은 확인해 보세요."
  - "점을 x 로 정렬해 절반으로 나누면, 가장 가까운 쌍은 왼쪽 안·오른쪽 안·경계를 가로지르는 셋 중 하나입니다."
ALGORITHM_CHOICE:
  - "양쪽에서 얻은 답 d 보다 경계선에서 먼 점은 가로지르는 쌍에 낄 수 없습니다. 경계선 양쪽 폭 d 의 띠만 남기세요."
  - "띠를 y 로 정렬하면 한 점과 y 차가 d 를 넘는 점은 볼 필요가 없습니다. 그 안에는 점이 상수 개뿐입니다."
OPTIMIZATION:
  - "모든 쌍은 10만 점에서 50억 쌍입니다. 나누고 띠만 보면 단계마다 n 에 비례하는 일만 남습니다."
  - "띠 안에서 '다음 몇 개만' 이라고 개수를 고정하면 놓칩니다. y 차가 d 를 넘을 때까지 보는 것이 맞고 그것이 상수입니다."
CORRECTNESS:
  - "같은 자리의 점 둘은 거리 0 입니다. 정렬이 x 만 보면 같은 x 의 점들이 띠에서만 만나니 띠 검사가 그것을 잡아야 합니다."

# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

ALGORITHM_CHOICE:
  - "정렬하면 됩니다 — 그런데 O(n log n) 입니다. 정렬 없이 \"v+1 이 있는가\"를 O(1) 에 답하는 구조가 있습니다."
OPTIMIZATION:
  - "집합에서 모든 값마다 위로 세면 긴 수열 하나가 길이의 제곱만큼 비용을 냅니다. 어느 값에서만 세면 각 수열을 한 번만 셀까요."
  - "v-1 이 없는 v 가 수열의 시작점입니다. 거기서만 세세요."
COMPLEXITY:
  - "시작점에서만 세면 각 값은 한 수열 안에서 한 번만 세어집니다 — 전체 O(n)."
EDGE_CASES:
  - "같은 값은 한 번입니다. 값이 Int 의 끝이면 v+1 이 넘칩니다 — 넘치면 Int.MIN_VALUE 가 되어 이어지는 것처럼 보일 수 있습니다."

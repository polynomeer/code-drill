# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "구간마다 최솟값을 맡는 원소를 하나 정한다면, 원소 i 가 최솟값인 구간들의 시작과 끝은 어느 범위에 있나요?"
  - "시작 x 와 끝 y 가 각각 범위를 돌 때, 구간 합 P[y+1] − P[x] 를 모두 더한 값을 누적합의 누적합으로 나타낼 수 있나요?"
CORRECTNESS:
  - "같은 값이 여럿인 구간에서 최솟값을 맡는 원소는 몇 개여야 하나요? 왼쪽과 오른쪽 경계에서 등호를 어디에 두나요?"
EDGE_CASES:
  - "나머지 연산 중에 뺄셈이 있습니다. 결과가 음수가 되면 어떻게 하나요?"
COMPLEXITY:
  - "시작마다 끝을 늘려 가면 10 만 명에서 몇 구간인가요?"

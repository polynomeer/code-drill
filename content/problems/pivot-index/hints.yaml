# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "자기 자신은 어느 쪽에도 들지 않습니다. 맨 왼쪽 자리의 왼쪽 합은 0 이고 그것도 합입니다 — 오른쪽 합이 0 이면 맨 왼쪽이 답일 수 있습니다."
MODELING:
  - "전체 합을 알면 자리 i 의 오른쪽 합은 전체 − 왼쪽 − nums[i] 입니다. 왼쪽 합만 누적하며 한 번에 보세요."
EDGE_CASES:
  - "음수가 있으니 '합이 0 이면 답이 없다' 같은 지름길은 없습니다. 둘 이상이면 가장 왼쪽입니다."

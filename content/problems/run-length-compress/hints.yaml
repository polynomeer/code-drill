# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "한 번 나온 글자에는 숫자를 붙이지 않습니다. 열 번 이상이면 숫자가 두 자리 이상입니다 — 한 글자가 아니라 십진 표기 그대로입니다."
IMPLEMENTATION:
  - "읽는 자리와 쓰는 자리를 따로 두세요. 연속한 구간의 끝을 찾고, 글자 하나를 쓰고, 길이가 2 이상이면 길이를 문자열로 바꿔 한 글자씩 씁니다. 쓰는 자리는 읽는 자리를 앞지르지 못합니다."
EDGE_CASES:
  - "마지막 구간을 빠뜨리기 쉽습니다 — 글자가 바뀔 때만 구간을 닫으면 끝의 구간은 닫히지 않습니다. 글자 하나짜리 입력, 전부 같은 글자, 길이 10·100 인 구간으로 확인하세요."

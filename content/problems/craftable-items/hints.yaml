# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "만들 수 있다의 조건을 둘로 나눠 적어 보세요. 재료가 있어야 하고, 그 재료를 모두 갖춰야 합니다."
  - "재료가 하나도 없는 물건은 어떤가요? 처음 가진 것이 아니면 만들 길이 없습니다. 그리고 답에는 처음 가진 물건이 들어가지 않습니다."
MODELING:
  - "물건마다 아직 갖추지 못한 재료의 수를 세어 두면, 무언가를 갖출 때마다 그 수가 하나씩 줄어듭니다. 0 이 되면요?"
  - "들어오는 간선이 모두 풀린 정점을 꺼내는 것과 같은 일입니다. 다만 출발점이 재료 없는 정점이 아니라 가진 물건입니다."
EDGE_CASES:
  - "서로를 재료로 쓰는 두 물건은 만들 수 있나요? 그 수가 끝내 0 이 되지 않는 이유를 생각해 보세요."

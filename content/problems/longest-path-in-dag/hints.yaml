# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "순환이 없으면 정점을 위상 순서로 늘어놓을 수 있고, 그 순서로 정점 u 를 꺼낼 때 u 에 이르는 가장 긴 경로는 이미 정해져 있습니다. 나가는 간선마다 dist[v] 를 dist[u] + 1 로 늘려 보세요."
ALGORITHM_CHOICE:
  - "Kahn 의 큐로 위상 순서를 만들면 순환 검사가 덤입니다 — 꺼낸 정점이 n 개보다 적으면 순환이 있습니다. 두 질문이 한 번의 훑기에서 답이 나옵니다."
CONSTRAINTS:
  - "정점이 10만 개고 사슬이 길 수 있습니다. 재귀 DFS 는 5만 깊이에서 스택이 넘칩니다 — 답이 맞는 풀이가 RUNTIME_ERROR 로 끝납니다. 큐로 반복하세요."
EDGE_CASES:
  - "정점 하나는 길이 0 입니다. 자기 자신으로 가는 간선은 순환입니다. 순환이 한쪽 구석에만 있어도 답은 −1 입니다."
COMPLEXITY:
  - "정점과 간선을 한 번씩 — O(n + m) 입니다. 진입 차수 0 인 정점마다 따로 훑으면 O(n·m) 이 됩니다."

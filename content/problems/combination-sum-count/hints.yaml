# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "순서만 다른 것은 같은 조합입니다 — 2+3 과 3+2 는 하나. 후보는 몇 번이든 다시 쓸 수 있습니다."
MODELING:
  - "순서를 세지 않으려면 후보를 정한 순서로만 고르세요. i 번째 후보부터 보되 '하나 더 쓴다'(i 그대로)와 '그만 쓴다'(i+1) 둘로 갈립니다."
CORRECTNESS:
  - "남은 합이 0 이면 하나, 음수거나 후보가 끝나면 0 입니다. 하나 더 쓸 때 i 를 올리면 한 번씩만 쓰는 문제가 됩니다."
OPTIMIZATION:
  - "같은 (i, 남은 합) 이 거듭 나옵니다. 기억하면 n × target 이고, 안 하면 target 500 에서 지수입니다."

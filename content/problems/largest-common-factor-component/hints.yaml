# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "두 수가 이어진다는 것은 공통 소인수가 있다는 것입니다. 그러면 '수'와 '소수'를 같은 그래프의 정점으로 두고, 수를 자기 소인수 각각과 잇는 것으로 충분합니다 — 같은 소수를 가진 수들은 그 소수를 거쳐 이어집니다."
ALGORITHM_CHOICE:
  - "연결 요소는 유니온파인드입니다. 정점은 최대값까지의 정수 전부로 두면 수와 소수를 같은 배열로 다룰 수 있습니다."
  - "소인수는 최대값까지의 최소 소인수 체로 O(log) 에 나옵니다. 소인수 하나마다 union 하세요 — 가장 작은 것만이 아니라 전부."
OPTIMIZATION:
  - "쌍마다 gcd 는 2 만 개에서 2 억 쌍입니다. 수마다 소인수 몇 개와 union 하면 수 × log 입니다."
CORRECTNESS:
  - "크기를 셀 때는 배열의 수만 셉니다. 소수 정점은 무리를 잇는 다리이지 구성원이 아닙니다."
CONSTRAINTS:
  - "1 은 소인수가 없어 아무와도 이어지지 않습니다. 1 을 '소인수 1' 과 묶는 순간 모든 수가 한 무리가 됩니다."

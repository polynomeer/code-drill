# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "작업 하나는 케이블 하나를 옮기는 것입니다. 케이블을 새로 얻지는 못하니, 전체 케이블이 n−1 개보다 적으면 무엇을 해도 안 됩니다."
MODELING:
  - "케이블이 충분하면 답은 연결 요소의 수 − 1 입니다. 요소 k 개를 하나로 잇는 데 k−1 개의 케이블이 필요하고, 여분 케이블(순환을 만드는 것)은 언제나 그만큼 있습니다."
  - "연결 요소의 수는 유니온파인드로 셉니다. 케이블마다 두 끝을 합치고, 이미 같은 무리였으면 그 케이블이 여분입니다."
CORRECTNESS:
  - "케이블 수가 n−1 개면 충분합니다 — 여분이 정확히 요소 수 − 1 개 있습니다. n 개를 요구하면 한 케이블 모자란다고 잘못 답합니다."
EDGE_CASES:
  - "컴퓨터가 하나면 0 입니다. 같은 쌍의 케이블이 여럿이거나 자기 자신에게 꽂힌 케이블은 전부 여분입니다."

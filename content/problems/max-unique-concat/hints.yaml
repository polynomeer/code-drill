# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "낱말 하나가 쓰는 글자를 26 칸짜리 표시로 적어 두면, 두 낱말이 겹치는지는 어떻게 알 수 있나요?"
  - "자기 안에서 이미 글자가 겹치는 낱말을 그 표시로 적으면 겹침이 보이나요? 그런 낱말은 처음부터 어떻게 다룰까요?"
ALGORITHM_CHOICE:
  - "넣을 수 있는 낱말은 늘 넣는 것이 이득인가요? 짧은 낱말 하나가 긴 낱말 둘을 막는 예를 만들어 보세요."
IMPLEMENTATION:
  - "한 갈래에서 넣은 글자는 돌아올 때 빼야 다음 갈래가 같은 상태에서 시작합니다."

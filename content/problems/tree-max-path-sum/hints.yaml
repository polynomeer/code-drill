# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "어떤 경로든 가장 높은 정점이 하나 있습니다. 그 정점에서 아래로 몇 갈래까지 내려갈 수 있나요?"
  - "정점마다 여기서 아래로 한 갈래만 내려가는 경로의 최대 합을 구해 두면, 그 정점을 꼭대기로 하는 가장 좋은 경로는 무엇으로 만들어지나요?"
CORRECTNESS:
  - "합이 음수인 갈래를 붙이면 손해입니다. 붙이지 않는 것도 선택지에 넣으세요."
EDGE_CASES:
  - "값이 모두 음수면 답은 무엇인가요? 가장 큰 합을 0 에서 시작하면 그 답이 나오나요?"
IMPLEMENTATION:
  - "트리가 20 만 깊이의 사슬일 수 있습니다. 재귀 대신, 부모보다 자식을 먼저 처리하는 순서를 미리 만들어 거꾸로 훑어 보세요."

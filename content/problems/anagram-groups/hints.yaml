# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "두 단어가 같은 묶음인지 판단하는 규칙을 \"이름표\" 하나로 바꿔 보세요. 같은 묶음이면 같은 이름표, 다르면 다른 이름표."
  - "글자를 정렬한 문자열이 그 이름표입니다. 서로 다른 이름표의 수가 답입니다."
EDGE_CASES:
  - "글자의 집합만 보면 aab 와 abb 가 같은 묶음이 됩니다. 이름표는 무엇을 더 담아야 하나요."
  - "빈 단어 둘은 한 묶음입니다. 대소문자는 다른 글자입니다. 쉼표와 탭도 글자입니다."
IMPLEMENTATION:
  - "이름표를 집합에 넣으면 크기가 답입니다. 단어끼리 서로 비교할 필요가 없습니다."

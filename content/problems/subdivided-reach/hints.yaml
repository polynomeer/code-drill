# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "새 정점을 실제로 만들면 몇 개인가요? 원래 정점만 남긴 그래프에서 간선 (u, v, c) 의 무게는 얼마로 두면 되나요?"
  - "원래 정점까지의 최단 거리를 알면, 간선 위의 새 정점 가운데 몇 개에 닿을 수 있나요? 어느 쪽 끝에서 들어오나요?"
CORRECTNESS:
  - "양 끝에서 들어온 걸음을 더하면 같은 새 정점을 두 번 셀 수 있나요? 무엇으로 자르나요?"
  - "새 정점 c 개를 끼운 간선은 몇 걸음인가요?"
EDGE_CASES:
  - "한쪽 끝까지 가는 데 maxMoves 보다 많이 걸리면 그쪽에서 들어가는 걸음은 몇인가요? 아예 갈 수 없는 끝이라면요?"

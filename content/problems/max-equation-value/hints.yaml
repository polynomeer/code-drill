# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "i < j 면 |xs[i] − xs[j]| 는 무엇인가요? 식을 i 에만 걸린 부분과 j 에만 걸린 부분으로 나눠 보세요."
ALGORITHM_CHOICE:
  - "j 를 왼쪽부터 옮길 때, 창 [xs[j] − k, xs[j]) 안의 앞선 점들에서 가장 큰 ys[i] − xs[i] 가 필요합니다. 창 안의 최댓값을 빨리 아는 자료구조는 무엇인가요?"
EDGE_CASES:
  - "새 점을 덱에 넣은 뒤에 답을 보면 무엇과 짝지어질 수 있나요?"
  - "x 의 차가 정확히 k 인 쌍은 되나요?"
COMPLEXITY:
  - "점마다 창 안의 앞선 점을 모두 훑으면, 창이 넓을 때 20 만 점에서 몇 쌍인가요?"

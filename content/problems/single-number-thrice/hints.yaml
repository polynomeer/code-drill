# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "두 번씩일 때의 XOR 은 여기서 안 됩니다 — 같은 수를 세 번 XOR 하면 자기 자신이 남습니다. 대신 비트 자리마다 따로 생각해 보세요."
  - "어떤 비트 자리에서 1 인 수의 개수를 세면, 세 번 나오는 수의 몫은 3 의 배수입니다. 그 개수를 3 으로 나눈 나머지가 답의 그 비트입니다."
CORRECTNESS:
  - "나머지는 2 가 아니라 3 으로 취해야 합니다. 세 번 나온 수의 비트가 남지 않는지 확인하세요."
EDGE_CASES:
  - "답이 음수면 비트 31(부호)이 1 입니다. 31 자리까지 전부 세고, 부호 비트를 그대로 합치면 Int 가 알아서 음수가 됩니다."
CONSTRAINTS:
  - "합의 요령 3 × (서로 다른 수의 합) − 전체 합 은 Int 를 넘습니다. 값이 2³¹ 근처면 Long 으로도 아슬아슬합니다 — 비트로 세면 넘칠 것이 없습니다."

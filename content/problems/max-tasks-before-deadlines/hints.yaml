# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "작업을 고르는 것과 순서를 정하는 것이 둘 다 자유입니다. 고른 작업들은 마감이 이른 순서로 하면 언제나 손해가 없습니다 — 그러니 순서 문제는 사라지고 무엇을 고를지만 남습니다."
IMPLEMENTATION:
  - "마감순으로 하나씩 넣다가 지금 작업의 마감을 넘기면, 넣어 둔 것 중 가장 오래 걸리는 하나를 빼세요. 시간을 가장 많이 되찾고 개수는 하나만 줄어듭니다."
  - "가장 긴 것을 빨리 찾는 구조가 최대 힙입니다. 뺀 것이 지금 넣은 것일 수도 있습니다."

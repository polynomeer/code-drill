# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "규칙은 셋입니다 — 단어의 첫 글자는 대문자, 나머지는 소문자, 공백은 개수와 자리 그대로. 셋째가 가장 자주 빠집니다."
  - "단어의 첫 글자란 문자열의 처음이거나 바로 앞이 공백인 글자입니다."
EDGE_CASES:
  - "앞뒤 공백, 연속한 공백, 공백만 있는 문자열, 빈 문자열을 넣어 보세요. 나누고 다시 합치면 그것들이 사라집니다."
IMPLEMENTATION:
  - "글자를 하나씩 보며 '지금이 단어의 시작인가'를 변수 하나로 들고 가면 공백을 건드릴 일이 없습니다. 공백을 만나면 그 변수를 켜고, 글자를 적으면 끕니다."

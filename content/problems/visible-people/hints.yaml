# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "i 가 j 를 보려면 사이의 모두가 둘 중 작은 쪽보다 작아야 합니다. 그러면 i 보다 큰 첫 사람은 보이나요? 그 뒤는요?"
MODELING:
  - "오른쪽에서부터 훑는다고 해 보세요. i 보다 작은 사람은 i 가 볼 수 있고, 그 뒤로 왼쪽 누구에게도 다시 보일 일이 없습니다. 그 사람들을 어떻게 치울까요?"
  - "키가 줄어드는 스택을 두면, i 가 꺼내는 사람 수가 곧 i 가 보는 작은 사람 수입니다. 꺼내고 남은 맨 위는요?"
EDGE_CASES:
  - "키가 줄어들기만 하는 줄과 늘어나기만 하는 줄에서 답을 손으로 적어 보세요."

# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "값이 전부 양수라는 조건이 왜 있을까요. 구간을 오른쪽으로 늘리면 합은 어떻게 되고, 왼쪽을 줄이면 어떻게 되나요."
  - "합이 목표 이상이 된 순간, 왼쪽을 줄여도 여전히 이상이면 더 짧은 답이 있는 것입니다. 이상인 동안 계속 줄이세요."
CORRECTNESS:
  - "\"이상\"입니다. 정확히 같은 합도 답입니다. 03 번 경계 사례를 보세요."
  - "합이 목표 이상이 됐을 때 왼쪽을 한 칸만 줄이고 멈추면, 더 줄일 수 있는 경우를 놓칩니다."
COMPLEXITY:
  - "시작점마다 목표에 닿을 때까지 더하면 시작점 × 길이입니다. 20만 개에 값이 작으면 얼마나 깁니까."
  - "오른쪽 끝도 왼쪽 끝도 뒤로 가지 않습니다. 각각 n 번이면 전체 2n 입니다."
EDGE_CASES:
  - "그런 구간이 없으면 0 입니다. 원소 하나가 이미 목표 이상이면 1 입니다."

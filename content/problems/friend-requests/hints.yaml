# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "'같은 무리' 는 합치기와 묻기만 필요합니다. 그 둘만 하는 자료구조를 떠올리세요."
  - "어려운 것은 합치는 것이 아니라 '합치면 무엇이 깨지는가' 를 합치기 전에 아는 것입니다."
CONSTRAINTS:
  - "거절된 요청은 아무것도 바꾸지 않습니다. 먼저 합쳐 보고 되돌리는 방법이 왜 까다로운지 생각해 보세요."
CORRECTNESS:
  - "두 무리를 합쳐 금지된 쌍이 한 무리가 되는 경우는 하나뿐입니다 — 한쪽에 x, 다른 쪽에 y 가 있는 것. 대표끼리 견주면 됩니다."
ALGORITHM_CHOICE:
  - "요청과 금지가 각각 천 개입니다. 요청마다 금지를 한 번씩 훑는 것은 백만 번이고, 요청마다 무리를 다시 만드는 것은 그 곱절입니다."

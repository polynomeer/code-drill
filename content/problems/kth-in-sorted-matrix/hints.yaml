# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "\"k 번째로 작은 값이 무엇인가\" 대신 \"값 x 이하가 몇 개인가\" 를 물어 보세요. 두 번째 질문은 x 가 커질수록 답이 커집니다."
  - "그 개수가 처음으로 k 이상이 되는 x 가 답입니다. 단조로운 질문에 답하는 도구는 이미 압니다 — 배를 고르던 문제와 같은 모양입니다."
ALGORITHM_CHOICE:
  - "전부 꺼내 정렬하면 답은 나오지만 격자가 정렬돼 있다는 것을 쓰지 않은 것입니다. 100 만 개를 정렬하는 대신 무엇을 할 수 있을까요."
  - "행마다 오른쪽 끝에서 시작해 x 보다 큰 동안 왼쪽으로 가면 그 행에서 x 이하의 개수가 나옵니다. 다음 행에서는 되돌리지 않고 이어서 갑니다 — 열도 정렬돼 있기 때문입니다."
CORRECTNESS:
  - "이분 탐색이 격자에 없는 값에서 멈추면 어떻게 될까요. 06 번 경계 사례에서 2 와 8 사이의 값을 답하면 틀립니다."
  - "개수가 k 이상인 가장 작은 x 를 찾으면 그 x 는 반드시 격자에 있습니다. x-1 에서 개수가 줄었다는 것은 x 가 격자에 있다는 뜻입니다. \"k 이상\" 과 \"k 초과\" 를 헷갈리면 이 성질이 깨집니다."
COMPLEXITY:
  - "값 후보를 하나씩 늘리며 매번 격자 전체를 세면 값의 범위 × n² 입니다. 이분 탐색이면 log(범위) 번이고, 한 번 세는 데 n 이면 됩니다."

# 도움 사다리 (PRD FR-802). 코칭 세션이 약한 역량 1~2개에만 이 단계를 펼친다.
#
# 규칙 하나: **어느 단계에서도 코드를 주지 않는다.** 코드를 주는 순간 그것은 도움이
# 아니라 정답이고, 그 뒤에 남는 증거는 아무것도 재지 못한다.
#
# packageDigest 밖이다. 힌트를 고쳤다고 이미 내려진 판정이 무효가 되면 안 된다.

MODELING:
  - "s 의 앞 i 글자와 p 의 앞 j 글자가 맞는가를 표로 두세요. 마지막 패턴 원소가 보통 글자면 한 칸씩 물러납니다. * 면요."
  - "* 는 두 갈래입니다: 그 원소를 0 번 써서 p 에서 두 칸 물러나거나, 한 번 더 써서 s 에서 한 칸 물러나되 p 는 그대로."
CORRECTNESS:
  - "빈 s 에 a*b* 는 맞습니다. 표의 첫 행을 그렇게 채우지 않으면 x* 로 시작하는 패턴이 전부 틀립니다."
  - "* 는 0 번도 됩니다. 1 번 이상으로 두면 c*a*b 가 aab 에 안 맞습니다."
EDGE_CASES:
  - "부분이 아니라 전체가 맞아야 합니다. abc 에 ab 는 0 입니다."
COMPLEXITY:
  - "재귀로 두 갈래를 뻗으면 a*a*a*…b 에서 갈래가 지수적으로 늡니다. 표는 |s| × |p| 입니다."

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

MODELING:
  - "트리의 잎을 모두 동시에 한 겹 벗기면, 남은 트리의 가운데는 원래 트리의 가운데와 같은가요?"
  - "위상 정렬은 진입 차수가 0 인 정점을 꺼냅니다. 방향이 없는 트리에서 그 역할을 하는 정점은 무엇인가요?"
CORRECTNESS:
  - "잎을 하나씩 벗기다 둘 이하가 남는 순간 멈추면, 같은 겹의 다른 잎은 어떻게 되나요?"
EDGE_CASES:
  - "가운데는 늘 하나인가요? 정점이 짝수 개인 길에서는요? 정점이 하나뿐이면요?"
COMPLEXITY:
  - "정점마다 BFS 로 높이를 재면 20 만 정점에서 몇 걸음인가요?"

# 도움 사다리 (PRD FR-802). 어느 단계에서도 코드를 주지 않는다. packageDigest 밖이다.

READING:
  - "지울 값이 여러 번 나오면 몇 개를 지우나요? 그리고 남은 원소의 순서는 어떻게 돼야 하나요?"
IMPLEMENTATION:
  - "읽는 자리와 쓰는 자리를 따로 두어 보세요. 남길 값을 읽었을 때만 쓰는 자리에 옮기고 한 칸 밉니다."
  - "다 읽고 나면 쓰는 자리까지가 답입니다. 그 뒤에 남은 것은 무엇인가요?"
EDGE_CASES:
  - "지울 값이 연달아 있을 때, 그리고 모든 값이 지울 값일 때를 손으로 따라가 보세요."
